<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart | EMB_Sparkly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200;6..72,400;6..72,700&family=Red+Hat+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --black: #0d2b26;
    --white: #ffffff;
    --cream: #faf6ee;
    --gray: #6b6b64;
    --light-gray: #e5ded2;
    --accent: #c9a227;
    --gold: #c9a227;
    --gold-light: #e0c05a;
    --error: #b3413b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Red Hat Text', sans-serif;
    background: var(--white);
    color: var(--black);
    line-height: 1.6;
  }

  h1, h2, h3, h4, h5, h6 { font-family: 'Newsreader', serif; font-weight: 200; }
  a { text-decoration: none; color: inherit; }

  header {
    background: var(--white);
    border-bottom: 1px solid var(--light-gray);
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1400px;
    margin: 0 auto;
  }

  .header-brand { display: flex; align-items: center; gap: 10px; }

  .header-brand img {
    height: 36px;
    width: 36px;
    border-radius: 50%;
    object-fit: cover;
  }

  .brand-name {
    font-family: 'Newsreader', serif;
    font-weight: 200;
    font-size: 1.6rem;
    letter-spacing: 0.06em;
    color: var(--black);
  }

  .header-nav { display: flex; align-items: center; gap: 28px; }
  .header-nav a { font-size: 0.8rem; letter-spacing: 0.13em; text-transform: uppercase; color: var(--black); }
  .header-nav a:hover { opacity: 0.6; }

  .page-wrap { max-width: 900px; margin: 0 auto; padding: 32px 24px 60px; }

  .page-title {
    font-size: clamp(1.8rem, 4vw, 2.4rem);
    font-weight: 200;
    letter-spacing: 0.06em;
    margin-bottom: 24px;
  }

  .cart-item {
    display: flex;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid var(--light-gray);
    align-items: center;
  }

  .cart-item img {
    width: 72px;
    height: 96px;
    object-fit: cover;
    background: var(--cream);
    flex-shrink: 0;
  }

  .cart-item .info { flex: 1; min-width: 0; }

  .cart-item h3 {
    font-size: 0.9rem;
    font-weight: 400;
    letter-spacing: 0.03em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cart-item .unit-price { font-size: 0.8rem; color: var(--gray); margin-top: 2px; }

  .qty-controls {
    display: flex;
    align-items: center;
    border: 1px solid var(--black);
    flex-shrink: 0;
  }

  .qty-controls button {
    background: var(--white);
    border: none;
    width: 30px;
    height: 30px;
    font-size: 0.9rem;
    cursor: pointer;
    color: var(--black);
  }

  .qty-controls button:hover { background: var(--cream); }

  .qty-controls span { width: 30px; text-align: center; font-size: 0.85rem; }

  .line-total {
    font-weight: 400;
    font-size: 1rem;
    width: 80px;
    text-align: right;
    flex-shrink: 0;
  }

  .remove-btn {
    background: none;
    border: none;
    border-bottom: 1px solid var(--error);
    color: var(--error);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    flex-shrink: 0;
  }

  .summary-card {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--black);
    max-width: 420px;
    margin-left: auto;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }

  .summary-row.total {
    font-weight: 700;
    font-size: 1.1rem;
    border-top: 1px solid var(--light-gray);
    padding-top: 12px;
    margin-top: 12px;
  }

  .shipping-note { font-size: 0.72rem; color: var(--gray); margin-top: 4px; }

  .checkout-btn {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    background: var(--gold);
    color: var(--black);
    border: none;
    font-weight: 600;
    font-size: 0.8rem;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .checkout-btn:hover { background: var(--gold-light); }

  .empty-state {
    text-align: center;
    color: var(--gray);
    font-size: 0.9rem;
    padding: 60px 20px;
  }

  .empty-state a {
    display: inline-block;
    margin-top: 16px;
    background: var(--gold);
    color: var(--black);
    padding: 12px 30px;
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.13em;
    text-transform: uppercase;
  }

  .empty-state a:hover { background: var(--gold-light); }

  footer {
    background: var(--black);
    color: var(--white);
    padding: 28px 24px;
    text-align: center;
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="header-brand">
      <img src="image/logo.jpg" alt="EMB_Sparkly logo">
      <span class="brand-name">EMB_Sparkly</span>
    </a>
    <div class="header-nav">
      <a href="catalog.html">Continue Shopping</a>
    </div>
  </div>
</header>

<div class="page-wrap">
  <div class="page-title">Your Cart</div>
  <div id="cart-container">
    <div class="empty-state">Loading cart...</div>
  </div>
</div>

<footer>
  &copy; 2026 EMB_Sparkly. All rights reserved.
</footer>

<script>
  const SUPABASE_URL = "https://vaicofjsxjrbmirrphcc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_UkqihD8tVKi5Y9Ih6n418A_6r5GhMCc";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const CART_KEY = "emb_sparkly_cart";

  function getCart() {
    try {
      return JSON.parse(localStorage.getItem(CART_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function saveCart(cart) {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  }

  function calculateShipping(totalWeightKg) {
    if (totalWeightKg <= 0) return 0;
    if (totalWeightKg <= 0.8) return 5;
    if (totalWeightKg <= 1.5) return 10;
    if (totalWeightKg <= 2) return 15;
    const extraSteps = Math.ceil((totalWeightKg - 2) / 0.8);
    return 15 + (extraSteps * 5);
  }

  async function renderCart() {
    const container = document.getElementById("cart-container");
    const cart = getCart();

    if (cart.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          Your cart is empty.
          <br>
          <a href="catalog.html">Start Shopping</a>
        </div>
      `;
      return;
    }

    const ids = cart.map(item => item.id);
    const { data: liveProducts, error } = await supabaseClient
      .from("products")
      .select("id, name, price, image_url, stock, weight_kg")
      .in("id", ids);

    if (error || !liveProducts) {
      container.innerHTML = '<div class="empty-state">Could not load your cart right now.</div>';
      return;
    }

    let cartChanged = false;
    const validCart = [];

    cart.forEach(function(item) {
      const liveProduct = liveProducts.find(p => p.id === item.id);
      if (!liveProduct || liveProduct.stock <= 0) {
        cartChanged = true;
        return;
      }
      const cappedQty = Math.min(item.quantity, liveProduct.stock);
      if (cappedQty !== item.quantity) cartChanged = true;

      validCart.push({
        id: liveProduct.id,
        name: liveProduct.name,
        price: liveProduct.price,
        image_url: liveProduct.image_url,
        stock: liveProduct.stock,
        weight_kg: liveProduct.weight_kg || 0.5,
        quantity: cappedQty
      });
    });

    if (cartChanged) saveCart(validCart);

    if (validCart.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          Your cart is empty.
          <br>
          <a href="catalog.html">Start Shopping</a>
        </div>
      `;
      return;
    }

    let subtotal = 0;
    let totalWeight = 0;

    let itemsHtml = "";
    validCart.forEach(function(item) {
      const lineTotal = item.price * item.quantity;
      subtotal += lineTotal;
      totalWeight += item.weight_kg * item.quantity;

      itemsHtml += `
        <div class="cart-item" data-id="${item.id}">
          <img src="${item.image_url}" alt="${item.name}">
          <div class="info">
            <h3>${item.name}</h3>
            <div class="unit-price">$${Number(item.price).toFixed(2)} each</div>
          </div>
          <div class="qty-controls">
            <button type="button" class="qty-minus" data-id="${item.id}">-</button>
            <span>${item.quantity}</span>
            <button type="button" class="qty-plus" data-id="${item.id}">+</button>
          </div>
          <div class="line-total">$${lineTotal.toFixed(2)}</div>
          <button class="remove-btn" data-id="${item.id}">Remove</button>
        </div>
      `;
    });

    const shipping = calculateShipping(totalWeight);
    const total = subtotal + shipping;

    container.innerHTML = `
      <div class="cart-items">${itemsHtml}</div>
      <div class="summary-card">
        <div class="summary-row"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
        <div class="summary-row"><span>Shipping</span><span>$${shipping.toFixed(2)}</span></div>
        <div class="shipping-note">Based on total package weight (${totalWeight.toFixed(2)}kg). Ships to US states only.</div>
        <div class="summary-row total"><span>Total</span><span>$${total.toFixed(2)}</span></div>
        <button class="checkout-btn" id="checkout-btn">Proceed to Checkout</button>
      </div>
    `;

    attachCartEvents();
  }

  function attachCartEvents() {
    document.querySelectorAll(".qty-minus").forEach(function(btn) {
      btn.addEventListener("click", function() {
        changeQuantity(btn.dataset.id, -1);
      });
    });

    document.querySelectorAll(".qty-plus").forEach(function(btn) {
      btn.addEventListener("click", function() {
        changeQuantity(btn.dataset.id, 1);
      });
    });

    document.querySelectorAll(".remove-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        const cart = getCart().filter(item => item.id !== btn.dataset.id);
        saveCart(cart);
        renderCart();
      });
    });

    const checkoutBtn = document.getElementById("checkout-btn");
    if (checkoutBtn) {
      checkoutBtn.addEventListener("click", function() {
        window.location.href = "checkout.html";
      });
    }
  }

  function changeQuantity(id, delta) {
    const cart = getCart();
    const item = cart.find(i => i.id === id);
    if (!item) return;

    item.quantity += delta;
    if (item.quantity < 1) {
      const filteredCart = cart.filter(i => i.id !== id);
      saveCart(filteredCart);
    } else {
      saveCart(cart);
    }
    renderCart();
  }

  renderCart();
</script>

</body>
</html>

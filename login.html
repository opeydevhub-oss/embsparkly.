<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | E.M.B SPARKLY</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --deep-green: #0d2b26;
    --deep-green-dark: #081f1b;
    --gold: #c9a227;
    --gold-light: #e0c05a;
    --cream: #faf6ee;
    --charcoal: #1a1a1a;
    --gray: #6b6b64;
    --error: #b3413b;
    --success: #2f7a4f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--cream);
    color: var(--charcoal);
    line-height: 1.5;
    min-height: 100vh;
  }

  h1, h2, h3, .brand-name { font-family: 'Cormorant Garamond', serif; }
  a { text-decoration: none; color: inherit; }

  header {
    background: var(--deep-green);
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto;
  }

  .header-brand { display: flex; align-items: center; gap: 10px; }

  .header-brand img {
    height: 38px;
    width: 38px;
    border-radius: 50%;
    object-fit: cover;
  }

  .brand-name { color: var(--gold-light); font-size: 1.5rem; font-weight: 700; }

  .page-wrap {
    max-width: 420px;
    margin: 0 auto;
    padding: 40px 16px 60px;
  }

  .page-title { font-size: 1.6rem; font-weight: 600; color: var(--deep-green); margin-bottom: 6px; text-align: center; }
  .page-subtitle { color: var(--gray); font-size: 0.85rem; margin-bottom: 24px; text-align: center; }

  .mode-toggle {
    display: flex;
    border: 1px solid rgba(13,43,38,0.15);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .mode-btn {
    flex: 1;
    padding: 10px;
    text-align: center;
    background: #fff;
    border: none;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--gray);
    cursor: pointer;
  }

  .mode-btn.active {
    background: var(--deep-green);
    color: var(--gold-light);
    font-weight: 600;
  }

  .card {
    background: #fff;
    border-radius: 8px;
    padding: 22px 20px;
    border: 1px solid rgba(13,43,38,0.08);
  }

  label { display: block; font-size: 0.8rem; margin-bottom: 5px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }

  input {
    width: 100%;
    padding: 11px 12px;
    border-radius: 5px;
    border: 1px solid rgba(13,43,38,0.18);
    font-family: 'Jost', sans-serif;
    font-size: 0.9rem;
    outline: none;
    background: #fff;
    color: var(--charcoal);
  }

  input:focus { border-color: var(--gold); }

  .submit-btn {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: var(--deep-green);
    color: var(--gold-light);
    border: none;
    border-radius: 5px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }

  .submit-btn:hover:not(:disabled) { background: var(--deep-green-dark); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .form-message {
    margin-top: 14px;
    font-size: 0.83rem;
    display: none;
    text-align: center;
  }

  .form-message.error { color: var(--error); display: block; }
  .form-message.success { color: var(--success); display: block; }

  .field-hint {
    font-size: 0.75rem;
    color: var(--gray);
    text-align: center;
    margin-top: 18px;
  }

  footer {
    background: var(--deep-green-dark);
    color: rgba(250,246,238,0.75);
    padding: 32px 20px 20px;
    text-align: center;
    font-size: 0.8rem;
  }
</style>
</head>

<body>

<header>
  <div class="header-top">
    <a href="index.html" class="header-brand">
      <img src="image/logo.jpg" alt="E.M.B SPARKLY logo">
      <span class="brand-name">E.M.B SPARKLY</span>
    </a>
  </div>
</header>

<div class="page-wrap">

  <div class="page-title" id="page-title">Welcome Back</div>
  <div class="page-subtitle" id="page-subtitle">Log in to continue</div>

  <div class="mode-toggle">
    <button class="mode-btn active" id="mode-login">Log In</button>
    <button class="mode-btn" id="mode-signup">Sign Up</button>
  </div>

  <div class="card">
    <form id="auth-form">

      <div id="fullname-field" style="display:none;">
        <label for="a-fullname">Full Name</label>
        <input type="text" id="a-fullname" placeholder="Your full name">
      </div>

      <label for="a-email">Email</label>
      <input type="email" id="a-email" required placeholder="you@example.com">

      <label for="a-password">Password</label>
      <input type="password" id="a-password" required placeholder="At least 6 characters" minlength="6">

      <button type="submit" class="submit-btn" id="submit-btn">Log In</button>

      <div class="form-message" id="form-message"></div>

    </form>

    <div class="field-hint" id="switch-hint">
      Don't have an account? <a href="#" id="switch-link" style="color: var(--deep-green); font-weight:600;">Sign up</a>
    </div>
  </div>

</div>

<footer>
  &copy; 2026 E.M.B SPARKLY. All rights reserved.
</footer>

<script>

  const SUPABASE_URL = "https://vaicofjsxjrbmirrphcc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_UkqihD8tVKi5Y9Ih6n418A_6r5GhMCc";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const params = new URLSearchParams(window.location.search);
  const redirectTarget = params.get("redirect") || "index.html";

  let mode = "login";

  const pageTitle = document.getElementById("page-title");
  const pageSubtitle = document.getElementById("page-subtitle");
  const modeLoginBtn = document.getElementById("mode-login");
  const modeSignupBtn = document.getElementById("mode-signup");
  const fullnameField = document.getElementById("fullname-field");
  const fullnameInput = document.getElementById("a-fullname");
  const submitBtn = document.getElementById("submit-btn");
  const switchHint = document.getElementById("switch-hint");
  const switchLink = document.getElementById("switch-link");
  const messageEl = document.getElementById("form-message");

  // If already logged in, skip straight to the redirect target.
  async function checkExistingSession() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      window.location.href = redirectTarget;
    }
  }

  checkExistingSession();

  function setMode(newMode) {
    mode = newMode;
    messageEl.style.display = "none";

    if (mode === "login") {
      pageTitle.textContent = "Welcome Back";
      pageSubtitle.textContent = "Log in to continue";
      modeLoginBtn.classList.add("active");
      modeSignupBtn.classList.remove("active");
      fullnameField.style.display = "none";
      fullnameInput.required = false;
      submitBtn.textContent = "Log In";
      switchHint.innerHTML = 'Don\'t have an account? <a href="#" id="switch-link" style="color: var(--deep-green); font-weight:600;">Sign up</a>';
    } else {
      pageTitle.textContent = "Create Your Account";
      pageSubtitle.textContent = "Sign up to place your order";
      modeSignupBtn.classList.add("active");
      modeLoginBtn.classList.remove("active");
      fullnameField.style.display = "block";
      fullnameInput.required = true;
      submitBtn.textContent = "Sign Up";
      switchHint.innerHTML = 'Already have an account? <a href="#" id="switch-link" style="color: var(--deep-green); font-weight:600;">Log in</a>';
    }

    document.getElementById("switch-link").addEventListener("click", function(e) {
      e.preventDefault();
      setMode(mode === "login" ? "signup" : "login");
    });
  }

  modeLoginBtn.addEventListener("click", function() { setMode("login"); });
  modeSignupBtn.addEventListener("click", function() { setMode("signup"); });
  switchLink.addEventListener("click", function(e) {
    e.preventDefault();
    setMode("signup");
  });

  document.getElementById("auth-form").addEventListener("submit", async function(e) {
    e.preventDefault();

    submitBtn.disabled = true;
    messageEl.style.display = "none";

    const email = document.getElementById("a-email").value.trim();
    const password = document.getElementById("a-password").value;
    const fullName = fullnameInput.value.trim();

    try {

      if (mode === "signup") {

        if (!fullName) throw new Error("Please enter your full name.");

        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: { full_name: fullName }
          }
        });

        if (error) throw new Error(error.message);

        if (data.session) {
          // Email confirmation is off, user is logged in right away.
          window.location.href = redirectTarget;
        } else {
          // Email confirmation is on, user must verify first.
          messageEl.textContent = "Account created. Please check your email to confirm, then log in.";
          messageEl.className = "form-message success";
          setMode("login");
        }

      } else {

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) throw new Error(error.message);

        window.location.href = redirectTarget;

      }

    } catch (err) {
      messageEl.textContent = err.message || "Something went wrong. Please try again.";
      messageEl.className = "form-message error";
    }

    submitBtn.disabled = false;

  });

</script>

</body>
</html>

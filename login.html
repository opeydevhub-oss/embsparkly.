<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | E.M.B SPARKLY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --deep-green: #0d2b26;
    --deep-green-dark: #081f1b;
    --gold: #c9a227;
    --gold-light: #e0c05a;
    --cream: #faf6ee;
    --charcoal: #1a1a1a;
    --gray: #6b6b64;
    --error: #b3413b;
    --success: #2f7a4f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--deep-green-dark);
    color: var(--charcoal);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .login-card {
    background: var(--cream);
    border-radius: 8px;
    max-width: 380px;
    width: 100%;
    padding: 36px 28px;
  }

  .crest {
    width: 56px;
    height: 56px;
    margin: 0 auto 16px;
    border: 1.5px solid var(--gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    color: var(--gold);
    font-size: 1.2rem;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    font-weight: 600;
    color: var(--deep-green);
    text-align: center;
    margin-bottom: 4px;
  }

  .subtitle {
    text-align: center;
    font-size: 0.85rem;
    color: var(--gray);
    margin-bottom: 26px;
  }

  .tabs {
    display: flex;
    margin-bottom: 22px;
    border-bottom: 1px solid rgba(13,43,38,0.12);
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--gray);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }

  .tab.active {
    color: var(--deep-green);
    border-bottom-color: var(--gold);
  }

  label {
    display: block;
    font-size: 0.8rem;
    color: var(--charcoal);
    margin-bottom: 5px;
    margin-top: 14px;
  }

  input {
    width: 100%;
    padding: 11px 12px;
    border-radius: 5px;
    border: 1px solid rgba(13,43,38,0.18);
    font-family: 'Jost', sans-serif;
    font-size: 0.9rem;
    outline: none;
  }

  input:focus { border-color: var(--gold); }

  .submit-btn {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    background: var(--deep-green);
    color: var(--gold-light);
    border: none;
    border-radius: 5px;
    font-family: 'Jost', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .submit-btn:hover { background: var(--deep-green-dark); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .message {
    margin-top: 14px;
    font-size: 0.82rem;
    text-align: center;
    display: none;
  }

  .message.error { color: var(--error); display: block; }
  .message.success { color: var(--success); display: block; }

  .back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    font-size: 0.82rem;
    color: var(--gray);
    text-decoration: none;
  }

  .back-link:hover { color: var(--deep-green); }
</style>
</head>
<body>

<div class="login-card">
  <div class="crest">EMB</div>
  <h1>E.M.B SPARKLY</h1>
  <p class="subtitle">Sign in to continue</p>

  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">Log In</div>
    <div class="tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</div>
  </div>

  <form id="auth-form">
    <label for="email">Email</label>
    <input type="email" id="email" required placeholder="you@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" required placeholder="••••••••">

    <button type="submit" class="submit-btn" id="submit-btn">Log In</button>

    <div class="message" id="message"></div>
  </form>

  <a href="#" class="back-link" id="forgot-link" style="margin-top:14px;">Forgot password?</a>

  <form id="forgot-form" style="display:none;">
    <label for="forgot-email">Email</label>
    <input type="email" id="forgot-email" required placeholder="you@example.com">

    <button type="submit" class="submit-btn" id="forgot-submit-btn">Send Reset Link</button>

    <div class="message" id="forgot-message"></div>
  </form>

  <form id="reset-form" style="display:none;">
    <label for="new-password">New Password</label>
    <input type="password" id="new-password" required placeholder="Enter a new password">

    <button type="submit" class="submit-btn" id="reset-submit-btn">Set New Password</button>

    <div class="message" id="reset-message"></div>
  </form>

  <a href="index.html" class="back-link">&larr; Back to shop</a>
</div>

<script>
  const SUPABASE_URL = "https://vaicofjsxjrbmirrphcc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_UkqihD8tVKi5Y9Ih6n418A_6r5GhMCc";

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let mode = "login";

  function switchTab(newMode) {
    mode = newMode;
    document.getElementById("tab-login").classList.toggle("active", mode === "login");
    document.getElementById("tab-signup").classList.toggle("active", mode === "signup");
    document.getElementById("submit-btn").textContent = mode === "login" ? "Log In" : "Sign Up";
    document.getElementById("message").style.display = "none";
  }

  document.getElementById("auth-form").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const messageEl = document.getElementById("message");
    const submitBtn = document.getElementById("submit-btn");

    submitBtn.disabled = true;
    messageEl.style.display = "none";

    try {
      let result;
      if (mode === "login") {
        result = await supabaseClient.auth.signInWithPassword({ email, password });
      } else {
        result = await supabaseClient.auth.signUp({ email, password });
      }

      if (result.error) {
        messageEl.textContent = result.error.message;
        messageEl.className = "message error";
      } else {
        if (mode === "login") {
          messageEl.textContent = "Logged in! Redirecting...";
          messageEl.className = "message success";
          const params = new URLSearchParams(window.location.search);
          const redirectTo = params.get("redirect") || "index.html";
          setTimeout(() => { window.location.href = redirectTo; }, 1000);
        } else {
          messageEl.textContent = "Account created! You can now log in.";
          messageEl.className = "message success";
          switchTab("login");
        }
      }
    } catch (err) {
      messageEl.textContent = "Something went wrong. Please try again.";
      messageEl.className = "message error";
    }

    submitBtn.disabled = false;
  });

  document.getElementById("forgot-link").addEventListener("click", function(e) {
    e.preventDefault();
    document.getElementById("auth-form").style.display = "none";
    document.querySelector(".tabs").style.display = "none";
    document.getElementById("forgot-link").style.display = "none";
    document.getElementById("forgot-form").style.display = "block";
  });

  document.getElementById("forgot-form").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("forgot-email").value.trim();
    const messageEl = document.getElementById("forgot-message");
    const btn = document.getElementById("forgot-submit-btn");
    btn.disabled = true;
    messageEl.style.display = "none";

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname
    });

    if (error) {
      messageEl.textContent = error.message;
      messageEl.className = "message error";
    } else {
      messageEl.textContent = "Check your email for a reset link.";
      messageEl.className = "message success";
    }

    btn.disabled = false;
  });

  document.getElementById("reset-form").addEventListener("submit", async function(e) {
    e.preventDefault();

    const newPassword = document.getElementById("new-password").value;
    const messageEl = document.getElementById("reset-message");
    const btn = document.getElementById("reset-submit-btn");
    btn.disabled = true;
    messageEl.style.display = "none";

    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

    if (error) {
      messageEl.textContent = error.message;
      messageEl.className = "message error";
    } else {
      messageEl.textContent = "Password updated. You can now log in.";
      messageEl.className = "message success";
      setTimeout(() => { window.location.href = "login.html"; }, 1500);
    }

    btn.disabled = false;
  });

  if (window.location.hash.includes("type=recovery")) {
    document.getElementById("auth-form").style.display = "none";
    document.querySelector(".tabs").style.display = "none";
    document.getElementById("forgot-link").style.display = "none";
    document.getElementById("reset-form").style.display = "block";
  }
</script>

</body>
</html>

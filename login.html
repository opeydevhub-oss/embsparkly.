<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | E.M.B SPARKLY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --deep-green: #0d2b26;
    --deep-green-dark: #081f1b;
    --gold: #c9a227;
    --gold-light: #e0c05a;
    --gold-disabled: #c7a653;
    --cream: #faf6ee;
    --gray: #6b6b64;
    --border: #e0d8c8;
    --danger: #b54545;
    --success: #2e8b57;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--cream);
    color: var(--deep-green);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  a { text-decoration: none; color: inherit; }

  header {
    background: var(--deep-green);
    color: var(--cream);
    padding: 14px 5vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-brand { display: flex; align-items: center; gap: 10px; }
  .header-brand img { height: 38px; width: 38px; border-radius: 50%; object-fit: cover; }

  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  .header-links { display: flex; gap: 22px; }

  .header-links a {
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(250,246,238,0.75);
  }

  .header-links a:hover { color: var(--gold-light); }

  .auth-card {
    width: 100%;
    max-width: 420px;
    margin: 64px auto 48px;
    background: #fff;
    border: 1px solid var(--border);
    padding: 36px 32px;
  }

  .auth-card h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 1.7rem;
    text-align: center;
    letter-spacing: 0.03em;
  }

  .auth-subtitle {
    text-align: center;
    color: var(--gray);
    font-size: 0.85rem;
    margin-top: 4px;
    margin-bottom: 24px;
  }

  .mode-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin-bottom: 24px;
    border: 1px solid var(--deep-green);
  }

  .mode-btn {
    padding: 10px;
    background: #fff;
    color: var(--deep-green);
    font-family: 'Jost', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
  }

  .mode-btn.active {
    background: var(--deep-green);
    color: var(--gold-light);
  }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--deep-green);
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--deep-green);
    font-family: 'Jost', sans-serif;
    font-size: 0.95rem;
    outline: none;
  }

  .field input:focus { border-color: var(--deep-green); }

  .pwd-wrap { position: relative; }

  .eye-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    color: var(--gray);
  }

  .strength { display: none; margin: -6px 0 14px; font-size: 0.75rem; color: var(--gray); }
  .strength.ok { color: var(--success); }
  .strength-list { margin-top: 6px; padding-left: 16px; }
  .strength-list li { margin-bottom: 2px; }
  .strength-list li.pass { color: var(--success); }
  .strength-list li.fail { color: var(--gray); }
  .strength-list input { margin-right: 4px; transform: translateY(1px); }

  .submit-btn {
    width: 100%;
    padding: 13px;
    background: var(--deep-green);
    color: var(--gold-light);
    border: none;
    font-family: 'Jost', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .submit-btn:hover { background: var(--deep-green-dark); }
  .submit-btn:disabled { background: var(--gold-disabled); cursor: not-allowed; }

  .form-msg { display: none; margin-top: 14px; font-size: 0.83rem; color: var(--danger); text-align: center; line-height: 1.5; }

  .switch-note {
    text-align: center;
    font-size: 0.83rem;
    color: var(--gray);
    margin-top: 18px;
  }

  .switch-note a { color: var(--deep-green); font-weight: 600; text-decoration: underline; }

  .back-home {
    display: block;
    text-align: center;
    font-size: 0.83rem;
    color: var(--gray);
    margin-bottom: 56px;
  }

  .back-home a { color: var(--deep-green); font-weight: 600; }

  footer {
    margin-top: auto;
    background: var(--deep-green-dark);
    color: rgba(250,246,238,0.6);
    padding: 18px 5vw;
    text-align: center;
    font-size: 0.78rem;
  }
header { position: relative; }
  header .header-brand { position: absolute; left: 50%; transform: translateX(-50%); margin: 0; }

  .site-notice-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    background: var(--gold, #d9b26b);
    color: var(--deep-green, #0e3029);
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 600;
  }

  .site-notice-close {
    background: none;
    border: none;
    color: inherit;
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
    flex: 0 0 auto;
  }

  .menu-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.5rem;
    line-height: 1;
    padding: 0;
    min-width: 40px;
    text-align: left;
    color: var(--gold-light, currentColor);
  }

  .menu-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    opacity: 0;
    visibility: hidden;
    transition: opacity .25s ease, visibility .25s ease;
    z-index: 9999;
  }

  .menu-backdrop.show { opacity: 1; visibility: visible; }

  .menu-drawer {
    position: fixed;
    top: 0;
    left: 0;
    height: 100%;
    width: min(300px, 84vw);
    background: var(--cream, #faf6ee);
    color: var(--deep-green-dark, #081c18);
    transform: translateX(-100%);
    transition: transform .28s ease;
    z-index: 10000;
    overflow-y: auto;
    padding: 20px 18px;
  }

  .menu-drawer.open { transform: translateX(0); }

  .menu-drawer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .menu-drawer-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .menu-drawer-close {
    background: none;
    border: none;
    font-size: 1.7rem;
    line-height: 1;
    cursor: pointer;
    color: inherit;
    padding: 0 4px;
  }

  .menu-links { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }

  .menu-links a {
    padding: 10px 4px;
    font-size: 1rem;
    letter-spacing: 0.02em;
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  }

  .menu-links a:hover { color: var(--gold, #b8860b); }

  .menu-cat-title {
    font-size: 0.75rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gray, #8a8a7e);
    margin: 10px 0 8px;
  }

  .menu-categories { display: flex; flex-direction: column; gap: 2px; }

  .menu-cat-link {
    padding: 9px 4px;
    color: inherit;
    text-decoration: none;
    font-size: 0.95rem;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
  }

  .menu-cat-link:hover { color: var(--gold, #b8860b); }

  .menu-cat-empty { color: var(--gray, #8a8a7e); font-size: 0.85rem; padding: 6px 4px; }
</style>
</head>
<body>

<div id="site-notice"></div>
<div class="menu-backdrop" id="menu-backdrop"></div>
<nav class="menu-drawer" id="menu-drawer" aria-label="Site menu">
  <div class="menu-drawer-head">
    <span class="menu-drawer-title">Menu</span>
    <button type="button" class="menu-drawer-close" id="menu-close" aria-label="Close menu">&times;</button>
  </div>
  <div class="menu-links">
    <a href="index.html">Home</a>
    <a href="catalog.html">Shop</a>
    <a href="new-arrivals.html">New Arrivals</a>
    <a href="orders.html">Track Order</a>
    <a href="index.html#about">About</a>
  </div>
  <div class="menu-cat-title">Categories</div>
  <div class="menu-categories" id="menu-categories"><div class="menu-cat-empty">Loading...</div></div>
</nav>

<header>
  <button type="button" class="menu-btn" id="menu-btn" title="Menu" aria-label="Open menu">&#9776;</button>
  <a href="index.html" class="header-brand">
    <img src="image/logo.jpg" alt="E.M.B SPARKLY logo">
    <span class="brand-name">E.M.B SPARKLY</span>
  </a>
</header>

<div class="auth-card">
  <h1 id="auth-title">Welcome Back</h1>
  <p class="auth-subtitle" id="auth-subtitle">Log in to complete your order</p>

  <div class="mode-toggle">
    <button type="button" class="mode-btn active" id="mode-login-btn">Log In</button>
    <button type="button" class="mode-btn" id="mode-signup-btn">Sign Up</button>
  </div>

  <form id="auth-form" novalidate>
    <div class="field" id="name-field">
      <label for="full-name">Full Name</label>
      <input type="text" id="full-name" placeholder="Your name">
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="pwd-wrap">
        <input type="password" id="password" placeholder="Enter your password">
        <button type="button" class="eye-btn" id="eye-btn" title="Show password">&#128065;</button>
      </div>
    </div>

    <div class="strength" id="strength"></div>

    <button type="submit" class="submit-btn" id="submit-btn">Log In</button>
    <div class="form-msg" id="form-msg"></div>
  </form>

  <p class="switch-note" id="switch-note">New to E.M.B SPARKLY? <a href="#" id="switch-link">Create an account</a></p>
</div>

<div class="back-home"><a href="index.html">&#8592; Back to Home</a></div>

<footer>
  &copy; 2026 E.M.B SPARKLY. All rights reserved.
</footer>

<script>
  const SUPABASE_URL = "https://vaicofjsxjrbmirrphcc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_UkqihD8tVKi5Y9Ih6n418A_6r5GhMCc";

  /* SITE MENU + NOTIFICATIONS */
  (function() {
    var menuBtn = document.getElementById("menu-btn");
    var drawer = document.getElementById("menu-drawer");
    var backdrop = document.getElementById("menu-backdrop");
    var closeBtn = document.getElementById("menu-close");
    if (!menuBtn || !drawer || !backdrop || !closeBtn) return;

    function openMenu() { drawer.classList.add("open"); backdrop.classList.add("show"); }
    function closeMenu() { drawer.classList.remove("open"); backdrop.classList.remove("show"); }
    menuBtn.addEventListener("click", openMenu);
    closeBtn.addEventListener("click", closeMenu);
    backdrop.addEventListener("click", closeMenu);
    document.addEventListener("keydown", function(e) { if (e.key === "Escape") closeMenu(); });

    if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
      var client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      var catBox = document.getElementById("menu-categories");
      if (catBox) {
        client.from("categories").select("name, slug").order("name").then(function(res) {
          if (res.error || !res.data || res.data.length === 0) {
            catBox.innerHTML = '<div class="menu-cat-empty">Categories coming soon.</div>';
            return;
          }
          catBox.innerHTML = "";
          res.data.forEach(function(c) {
            var a = document.createElement("a");
            a.className = "menu-cat-link";
            a.href = "catalog.html?category=" + encodeURIComponent(c.slug);
            a.textContent = c.name;
            catBox.appendChild(a);
          });
        });
      }

      var notice = document.getElementById("site-notice");
      if (notice) {
        client.from("site_notifications").select("id, message").eq("is_active", true)
          .order("created_at", { ascending: false }).limit(1).then(function(res) {
            if (res.error || !res.data || res.data.length === 0) return;
            var n = res.data[0];
            var key = "emb_notice_closed_" + n.id;
            try { if (localStorage.getItem(key) === "1") return; } catch (e) {}
            var bar = document.createElement("div");
            bar.className = "site-notice-bar";
            var msg = document.createElement("span");
            msg.textContent = n.message;
            var x = document.createElement("button");
            x.type = "button";
            x.className = "site-notice-close";
            x.title = "Dismiss";
            x.innerHTML = "&times;";
            x.addEventListener("click", function() {
              try { localStorage.setItem(key, "1"); } catch (e) {}
              bar.remove();
            });
            bar.appendChild(msg);
            bar.appendChild(x);
            notice.appendChild(bar);
          });
      }
    }
  })();

  const params = new URLSearchParams(window.location.search);
  const redirectTarget = params.get("redirect") || "index.html";

  let mode = "login";
  let sb = null;

  const titleEl = document.getElementById("auth-title");
  const subtitleEl = document.getElementById("auth-subtitle");
  const submitBtn = document.getElementById("submit-btn");
  const msgEl = document.getElementById("form-msg");
  const nameField = document.getElementById("name-field");
  const strengthEl = document.getElementById("strength");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  function showMsg(text) {
    msgEl.textContent = text;
    msgEl.style.display = "block";
  }

  function clearMsg() {
    msgEl.textContent = "";
    msgEl.style.display = "none";
  }

  function setMode(nextMode) {
    mode = nextMode;
    const loginBtn = document.getElementById("mode-login-btn");
    const signupBtn = document.getElementById("mode-signup-btn");
    const switchLink = document.getElementById("switch-link");
    const switchNote = document.getElementById("switch-note");

    if (mode === "login") {
      loginBtn.classList.add("active");
      signupBtn.classList.remove("active");
      nameField.style.display = "none";
      strengthEl.style.display = "none";
      titleEl.textContent = "Welcome Back";
      subtitleEl.textContent = "Log in to complete your order";
      submitBtn.textContent = "Log In";
      switchNote.innerHTML = 'New to E.M.B SPARKLY? <a href="#" id="switch-link">Create an account</a>';
    } else {
      loginBtn.classList.remove("active");
      signupBtn.classList.add("active");
      nameField.style.display = "block";
      titleEl.textContent = "Create Your Account";
      subtitleEl.textContent = "Join E.M.B SPARKLY";
      submitBtn.textContent = "Sign Up";
      switchNote.innerHTML = 'Already have an account? <a href="#" id="switch-link">Log In</a>';
    }
    document.getElementById("switch-link").addEventListener("click", function(e) {
      e.preventDefault();
      clearMsg();
      setMode(mode === "login" ? "signup" : "login");
    });
    clearMsg();
  }

  document.getElementById("mode-login-btn").addEventListener("click", function() { clearMsg(); setMode("login"); });
  document.getElementById("mode-signup-btn").addEventListener("click", function() { clearMsg(); setMode("signup"); });

  const eyeBtn = document.getElementById("eye-btn");
  eyeBtn.addEventListener("click", function() {
    const isHidden = passwordInput.type === "password";
    passwordInput.type = isHidden ? "text" : "password";
  });

  passwordInput.addEventListener("input", function() {
    if (mode === "signup") updateStrength();
  });

  function updateStrength() {
    const val = passwordInput.value;
    const checks = [
      { label: "At least 8 characters", ok: val.length >= 8 },
      { label: "Contains a number", ok: /\d/.test(val) },
      { label: "Contains a letter", ok: /[a-zA-Z]/.test(val) }
    ];
    const passCount = checks.filter(c => c.ok).length;
    strengthEl.style.display = "block";
    strengthEl.innerHTML =
      'Password strength: ' + (passCount === 3 ? 'Strong' : passCount === 2 ? 'Good' : 'Weak') +
      '<ul class="strength-list">' +
      checks.map(c => '<li class="' + (c.ok ? 'pass' : 'fail') + '">' + (c.ok ? '\u2713' : '\u2717') + ' ' + c.label + '</li>').join('') +
      '</ul>';
  }

  async function initAuth() {
    if (typeof supabase === "undefined") {
      msgEl.innerHTML = "Login service is still loading. Please refresh in a few seconds.";
      msgEl.style.display = "block";
      return;
    }

    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const { data: sessionData } = await sb.auth.getSession();
    if (sessionData && sessionData.session) {
      window.location.href = redirectTarget;
    }
  }

  async function handleAuth(e) {
    e.preventDefault();
    clearMsg();

    if (!sb) {
      showMsg("Login service is loading. Please try again in a moment.");
      return;
    }

    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showMsg("Please enter a valid email address.");
      return;
    }
    if (!password) {
      showMsg("Please enter your password.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = mode === "login" ? "Logging In..." : "Creating Account...";

    if (mode === "login") {
      const { error } = await sb.auth.signInWithPassword({ email: email, password: password });
      if (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Log In";
        showMsg(error.message || "Could not log in. Check your email and password.");
        return;
      }
      window.location.href = redirectTarget;
    } else {
      const fullName = document.getElementById("full-name").value.trim();
      if (!fullName) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign Up";
        showMsg("Please enter your full name.");
        return;
      }

      const { data, error } = await sb.auth.signUp({
        email: email,
        password: password,
        options: { data: { full_name: fullName } }
      });

      if (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign Up";
        showMsg(error.message || "Could not create account.");
        return;
      }

      if (data.session) {
        window.location.href = redirectTarget;
      } else {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign Up";
        showMsg("Check your inbox to confirm your account, then log in.");
      }
    }
  }

  document.getElementById("auth-form").addEventListener("submit", handleAuth);

  setMode("login");
  initAuth();
</script>

</body>
</html>

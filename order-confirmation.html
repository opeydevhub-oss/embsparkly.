<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed | E.M.B SPARKLY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --deep-green: #0d2b26;
    --deep-green-dark: #081f1b;
    --gold: #c9a227;
    --gold-light: #e0c05a;
    --cream: #faf6ee;
    --charcoal: #1a1a1a;
    --gray: #6b6b64;
    --success: #2f7a4f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--cream);
    color: var(--charcoal);
    line-height: 1.5;
  }

  h1, h2, h3, .brand-name { font-family: 'Cormorant Garamond', serif; }
  a { text-decoration: none; color: inherit; }

  header {
    background: var(--deep-green);
    padding: 14px 20px;
  }

  .header-top { display: flex; align-items: center; max-width: 1200px; margin: 0 auto; }
  .header-brand { display: flex; align-items: center; gap: 10px; }

  .header-brand img {
    height: 38px;
    width: 38px;
    border-radius: 50%;
    object-fit: cover;
  }

  .brand-name { color: var(--gold-light); font-size: 1.5rem; font-weight: 700; }

  .page-wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 50px 20px 60px;
    text-align: center;
  }

  .check-circle {
    width: 68px;
    height: 68px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: var(--success);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
  }

  .page-title { font-size: 1.6rem; font-weight: 600; color: var(--deep-green); margin-bottom: 8px; }
  .page-subtitle { font-size: 0.9rem; color: var(--gray); margin-bottom: 26px; }

  .order-id-box {
    background: #fff;
    border: 1px solid rgba(13,43,38,0.1);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 22px;
    font-size: 0.85rem;
  }

  .order-id-box .label { color: var(--gray); font-size: 0.75rem; }
  .order-id-box .value { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 1.1rem; color: var(--deep-green); }

  .whatsapp-note {
    background: #eafaf0;
    border: 1px solid rgba(47,122,79,0.25);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 0.82rem;
    color: var(--charcoal);
    margin-bottom: 26px;
  }

  .whatsapp-note a { color: var(--success); font-weight: 600; }

  .action-buttons { display: flex; flex-direction: column; gap: 10px; }

  .btn-primary {
    background: var(--deep-green);
    color: var(--gold-light);
    padding: 12px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.9rem;
  }

  .btn-secondary {
    background: transparent;
    color: var(--deep-green);
    border: 1px solid rgba(13,43,38,0.2);
    padding: 12px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.9rem;
  }

  footer {
    background: var(--deep-green-dark);
    color: rgba(250,246,238,0.75);
    padding: 32px 20px 20px;
    text-align: center;
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <a href="index.html" class="header-brand">
      <img src="image/logo.jpg" alt="E.M.B SPARKLY logo">
      <span class="brand-name">E.M.B SPARKLY</span>
    </a>
  </div>
</header>

<div class="page-wrap">
  <div class="check-circle">&#10003;</div>
  <div class="page-title">Order Placed</div>
  <p class="page-subtitle">Thank you for shopping with us. We'll start getting your order ready.</p>

  <div class="order-id-box">
    <div class="label">Order Number</div>
    <div class="value" id="order-id-display">Loading...</div>
  </div>

  <div class="whatsapp-note">
    Have a question about your order? <a href="https://wa.me/message/NKLSS5LINWZ2H1" target="_blank">Message us on WhatsApp</a> and mention your order number.
  </div>

  <div class="action-buttons">
    <a href="orders.html" class="btn-primary">Track Your Orders</a>
    <a href="catalog.html" class="btn-secondary">Continue Shopping</a>
  </div>
</div>

<footer>
  &copy; 2026 E.M.B SPARKLY. All rights reserved.
</footer>

<script>
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get("order_id");
  const displayEl = document.getElementById("order-id-display");
  displayEl.textContent = orderId ? "#" + orderId.slice(0, 8) : "Unknown";
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed | E.M.B SPARKLY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --deep-green: #0d2b26;
    --deep-green-dark: #081f1b;
    --gold: #c9a227;
    --gold-light: #e0c05a;
    --cream: #faf6ee;
    --charcoal: #1a1a1a;
    --gray: #6b6b64;
    --success: #2f7a4f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--cream);
    color: var(--charcoal);
    line-height: 1.5;
  }

  h1, h2, h3, .brand-name { font-family: 'Cormorant Garamond', serif; }
  a { text-decoration: none; color: inherit; }

  header {
    background: var(--deep-green);
    padding: 14px 20px;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: center;
    max-width: 1200px;
    margin: 0 auto;
  }

  .header-brand { display: flex; align-items: center; gap: 10px; }

  .header-brand img {
    height: 38px;
    width: 38px;
    border-radius: 50%;
    object-fit: cover;
  }

  .brand-name { color: var(--gold-light); font-size: 1.5rem; font-weight: 700; }

  .page-wrap { max-width: 600px; margin: 0 auto; padding: 40px 16px 60px; text-align: center; }

  .success-icon {
    width: 64px;
    height: 64px;
    background: #e3f3e8;
    color: var(--success);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    margin: 0 auto 18px;
  }

  .page-title { font-size: 1.6rem; font-weight: 600; color: var(--deep-green); margin-bottom: 8px; }
  .page-subtitle { color: var(--gray); font-size: 0.9rem; margin-bottom: 26px; }

  .card {
    background: #fff;
    border-radius: 8px;
    padding: 22px;
    border: 1px solid rgba(13,43,38,0.08);
    text-align: left;
    margin-bottom: 22px;
  }

  .card h2 { font-size: 1rem; color: var(--deep-green); margin-bottom: 12px; }

  .order-line {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    padding: 6px 0;
    border-bottom: 1px solid rgba(13,43,38,0.06);
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    margin-top: 10px;
  }

  .summary-row.total {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--deep-green);
    border-top: 1px solid rgba(13,43,38,0.1);
    padding-top: 10px;
    margin-top: 10px;
  }

  .meta-line { font-size: 0.85rem; color: var(--gray); margin-bottom: 6px; }
  .meta-line strong { color: var(--charcoal); }

  .action-row { display: flex; flex-direction: column; gap: 10px; }

  .btn {
    display: block;
    padding: 12px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.9rem;
    text-align: center;
  }

  .btn-primary { background: var(--deep-green); color: var(--gold-light); }
  .btn-secondary { background: #fff; color: var(--deep-green); border: 1px solid rgba(13,43,38,0.2); }

  .empty-state { text-align: center; color: var(--gray); font-size: 0.9rem; padding: 60px 20px; }

  footer {
    background: var(--deep-green-dark);
    color: rgba(250,246,238,0.75);
    padding: 32px 20px 20px;
    text-align: center;
    font-size: 0.8rem;
  }
.header-top { position: relative; }
  .header-top .header-brand { position: absolute; left: 50%; transform: translateX(-50%); margin: 0; }
  .header-top .header-icons { margin-left: auto; }

  .site-notice-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    background: var(--gold, #d9b26b);
    color: var(--deep-green, #0e3029);
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 600;
  }

  .site-notice-close {
    background: none;
    border: none;
    color: inherit;
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
    flex: 0 0 auto;
  }

  .menu-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.5rem;
    line-height: 1;
    padding: 0;
    min-width: 40px;
    text-align: left;
    color: var(--gold-light, currentColor);
  }

  .menu-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    opacity: 0;
    visibility: hidden;
    transition: opacity .25s ease, visibility .25s ease;
    z-index: 9999;
  }

  .menu-backdrop.show { opacity: 1; visibility: visible; }

  .menu-drawer {
    position: fixed;
    top: 0;
    left: 0;
    height: 100%;
    width: min(300px, 84vw);
    background: var(--cream, #faf6ee);
    color: var(--deep-green-dark, #081c18);
    transform: translateX(-100%);
    transition: transform .28s ease;
    z-index: 10000;
    overflow-y: auto;
    padding: 20px 18px;
  }

  .menu-drawer.open { transform: translateX(0); }

  .menu-drawer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .menu-drawer-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .menu-drawer-close {
    background: none;
    border: none;
    font-size: 1.7rem;
    line-height: 1;
    cursor: pointer;
    color: inherit;
    padding: 0 4px;
  }

  .menu-links { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }

  .menu-links a {
    padding: 10px 4px;
    font-size: 1rem;
    letter-spacing: 0.02em;
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  }

  .menu-links a:hover { color: var(--gold, #b8860b); }

  .menu-cat-title {
    font-size: 0.75rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gray, #8a8a7e);
    margin: 10px 0 8px;
  }

  .menu-categories { display: flex; flex-direction: column; gap: 2px; }

  .menu-cat-link {
    padding: 9px 4px;
    color: inherit;
    text-decoration: none;
    font-size: 0.95rem;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
  }

  .menu-cat-link:hover { color: var(--gold, #b8860b); }

  .menu-cat-empty { color: var(--gray, #8a8a7e); font-size: 0.85rem; padding: 6px 4px; }
</style>
</head>
<body>

<div id="site-notice"></div>
<div class="menu-backdrop" id="menu-backdrop"></div>
<nav class="menu-drawer" id="menu-drawer" aria-label="Site menu">
  <div class="menu-drawer-head">
    <span class="menu-drawer-title">Menu</span>
    <button type="button" class="menu-drawer-close" id="menu-close" aria-label="Close menu">&times;</button>
  </div>
  <div class="menu-links">
    <a href="index.html">Home</a>
    <a href="catalog.html">Shop</a>
    <a href="orders.html">Track Order</a>
  </div>
  <div class="menu-cat-title">Categories</div>
  <div class="menu-categories" id="menu-categories"><div class="menu-cat-empty">Loading...</div></div>
</nav>

<header>
  <div class="header-top">
    <button type="button" class="menu-btn" id="menu-btn" title="Menu" aria-label="Open menu">&#9776;</button>
    <a href="index.html" class="header-brand">
      <img src="image/logo.jpg" alt="E.M.B SPARKLY logo">
      <span class="brand-name">E.M.B SPARKLY</span>
    </a>
  </div>
</header>

<div class="page-wrap" id="confirmation-container">
  <div class="empty-state">Loading your order...</div>
</div>

<footer>
  &copy; 2026 E.M.B SPARKLY. All rights reserved.
</footer>

<script>
  const SUPABASE_URL = "https://vaicofjsxjrbmirrphcc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_UkqihD8tVKi5Y9Ih6n418A_6r5GhMCc";

  /* SITE MENU + NOTIFICATIONS */
  (function() {
    var menuBtn = document.getElementById("menu-btn");
    var drawer = document.getElementById("menu-drawer");
    var backdrop = document.getElementById("menu-backdrop");
    var closeBtn = document.getElementById("menu-close");
    if (!menuBtn || !drawer || !backdrop || !closeBtn) return;

    function openMenu() { drawer.classList.add("open"); backdrop.classList.add("show"); }
    function closeMenu() { drawer.classList.remove("open"); backdrop.classList.remove("show"); }
    menuBtn.addEventListener("click", openMenu);
    closeBtn.addEventListener("click", closeMenu);
    backdrop.addEventListener("click", closeMenu);
    document.addEventListener("keydown", function(e) { if (e.key === "Escape") closeMenu(); });

    if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
      var client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      var catBox = document.getElementById("menu-categories");
      if (catBox) {
        client.from("categories").select("name, slug").order("name").then(function(res) {
          if (res.error || !res.data || res.data.length === 0) {
            catBox.innerHTML = '<div class="menu-cat-empty">Categories coming soon.</div>';
            return;
          }
          catBox.innerHTML = "";
          res.data.forEach(function(c) {
            var a = document.createElement("a");
            a.className = "menu-cat-link";
            a.href = "catalog.html?category=" + encodeURIComponent(c.slug);
            a.textContent = c.name;
            catBox.appendChild(a);
          });
        });
      }

      var notice = document.getElementById("site-notice");
      if (notice) {
        client.from("site_notifications").select("id, message").eq("is_active", true)
          .order("created_at", { ascending: false }).limit(1).then(function(res) {
            if (res.error || !res.data || res.data.length === 0) return;
            var n = res.data[0];
            var key = "emb_notice_closed_" + n.id;
            try { if (localStorage.getItem(key) === "1") return; } catch (e) {}
            var bar = document.createElement("div");
            bar.className = "site-notice-bar";
            var msg = document.createElement("span");
            msg.textContent = n.message;
            var x = document.createElement("button");
            x.type = "button";
            x.className = "site-notice-close";
            x.title = "Dismiss";
            x.innerHTML = "&times;";
            x.addEventListener("click", function() {
              try { localStorage.setItem(key, "1"); } catch (e) {}
              bar.remove();
            });
            bar.appendChild(msg);
            bar.appendChild(x);
            notice.appendChild(bar);
          });
      }
    }
  })();
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function getOrderIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("order_id");
  }

  function getSessionIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("session_id");
  }

  async function confirmPayment(sessionId) {
    const container = document.getElementById("confirmation-container");
    try {
      const { data, error } = await supabaseClient.functions.invoke(
        "confirm-stripe-payment",
        { body: { session_id: sessionId } }
      );

      if (error) {
        throw new Error((data && data.error) || error.message || "Payment not confirmed.");
      }

      if (data && data.paid && data.order_id) {
        localStorage.removeItem("emb_sparkly_cart");
        container.innerHTML = '<div class="empty-state">Payment confirmed. Loading your order...</div>';
        loadOrderById(data.order_id);
        return;
      }

      const orderId = getOrderIdFromUrl();
      if (data && data.order_id) {
        loadOrderById(data.order_id);
        return;
      }
      if (orderId) {
        loadOrderById(orderId);
        return;
      }
      throw new Error("Your payment has not been confirmed yet.");
    } catch (err) {
      container.innerHTML = '<div class="empty-state">' + (err.message || "Something went wrong.") + '<br><br><a href="orders.html" style="color:#0d2b26;">View My Orders</a></div>';
    }
  }

  async function loadOrderById(orderId) {
    const container = document.getElementById("confirmation-container");

    if (!orderId) {
      container.innerHTML = '<div class="empty-state">No order found.</div>';
      return;
    }

    const { data: order, error } = await supabaseClient
      .from("orders")
      .select(`
        id, status, payment_status, total, created_at, shipping_address, phone, customer_notes, customer_email,
        order_items ( quantity, price, size, color, products ( name ) )
      `)
      .eq("id", orderId)
      .single();

    if (error || !order) {
      container.innerHTML = '<div class="empty-state">We could not find this order.</div>';
      return;
    }

    const shortId = order.id.slice(0, 8);
    const dateStr = new Date(order.created_at).toLocaleDateString();

    let itemsHtml = "";
    let subtotal = 0;
    (order.order_items || []).forEach(function(item) {
      const lineTotal = item.price * item.quantity;
      subtotal += lineTotal;
      const productName = item.products ? item.products.name : "Item";
      let optionLine = "";
      const bits = [];
      if (item.size) bits.push("Size: " + item.size);
      if (item.color) bits.push("Color: " + item.color);
      if (bits.length > 0) optionLine = " <span style=\"color:#6b6b64;\">(" + bits.map(esc).join(" | ") + ")</span>";
      itemsHtml += `
        <div class="order-line">
          <span>${item.quantity} x ${productName}${optionLine}</span>
          <span>$${lineTotal.toFixed(2)}</span>
        </div>
      `;
    });

    const shipping = Number(order.total) - subtotal;

    const paymentLine = order.payment_status === "paid"
      ? '<div class="meta-line" style="color:#2f7a4f; font-weight:600;"><strong style="color:#2f7a4f;">Payment:</strong> Paid</div>'
      : '<div class="meta-line" style="color:#b5850f;"><strong style="color:#b5850f;">Payment:</strong> Awaiting payment</div>';

    container.innerHTML = `
      <div class="success-icon">&#10003;</div>
      <div class="page-title">Order Placed</div>
      <div class="page-subtitle">Thank you, your order has been received.</div>

      <div class="card">
        <h2>Order #${shortId} &middot; ${dateStr}</h2>
        ${itemsHtml}
        <div class="summary-row"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
        <div class="summary-row"><span>Shipping</span><span>$${shipping.toFixed(2)}</span></div>
        <div class="summary-row total"><span>Total</span><span>$${Number(order.total).toFixed(2)}</span></div>
      </div>

      <div class="card">
        <h2>Delivery Details</h2>
        <div class="meta-line"><strong>Ships to:</strong> ${order.shipping_address || "Not provided"}</div>
        <div class="meta-line"><strong>Phone:</strong> ${order.phone || "Not provided"}</div>
        ${order.customer_notes ? `<div class="meta-line"><strong>Notes:</strong> ${order.customer_notes}</div>` : ""}
        ${paymentLine}
        <div class="meta-line"><strong>Status:</strong> ${order.status}</div>
      </div>

      <div class="action-row">
        <a href="orders.html" class="btn btn-primary">Track My Orders</a>
        <a href="catalog.html" class="btn btn-secondary">Continue Shopping</a>
      </div>
    `;
  }

  function loadOrder() {
    const orderId = getOrderIdFromUrl();
    const sessionId = getSessionIdFromUrl();

    if (sessionId) {
      document.getElementById("confirmation-container").innerHTML = '<div class="empty-state">Confirming your payment...</div>';
      confirmPayment(sessionId);
      return;
    }

    loadOrderById(orderId);
  }

  loadOrder();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed | EMB_Sparkly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200;6..72,400;6..72,700&family=Red+Hat+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --black: #0d2b26;
    --white: #ffffff;
    --cream: #faf6ee;
    --gray: #6b6b64;
    --light-gray: #e5ded2;
    --accent: #c9a227;
    --gold: #c9a227;
    --gold-light: #e0c05a;
    --success: #2f7a4f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Red Hat Text', sans-serif;
    background: var(--white);
    color: var(--black);
    line-height: 1.6;
  }

  h1, h2, h3, h4, h5, h6 { font-family: 'Newsreader', serif; font-weight: 200; }
  a { text-decoration: none; color: inherit; }

  header {
    background: var(--white);
    border-bottom: 1px solid var(--light-gray);
    padding: 16px 24px;
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    max-width: 1400px;
    margin: 0 auto;
  }

  .header-brand { display: flex; align-items: center; gap: 10px; }

  .header-brand img {
    height: 36px;
    width: 36px;
    border-radius: 50%;
    object-fit: cover;
  }

  .brand-name {
    font-family: 'Newsreader', serif;
    font-weight: 200;
    font-size: 1.6rem;
    letter-spacing: 0.06em;
    color: var(--black);
  }

  .page-wrap { max-width: 700px; margin: 0 auto; padding: 48px 16px 64px; text-align: center; }

  .success-icon {
    width: 64px;
    height: 64px;
    background: var(--cream);
    border: 1px solid var(--gold);
    color: var(--black);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    margin: 0 auto 20px;
  }

  .page-title {
    font-size: 2.2rem;
    font-weight: 200;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }

  .page-subtitle { color: var(--gray); font-size: 0.9rem; margin-bottom: 32px; letter-spacing: 0.06em; }

  .card {
    padding: 24px 0;
    border-top: 1px solid var(--black);
    text-align: left;
  }

  .card + .card { border-bottom: 1px solid var(--black); }

  .card h2 {
    font-size: 1.2rem;
    font-weight: 200;
    letter-spacing: 0.06em;
    margin-bottom: 14px;
  }

  .order-line {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    padding: 6px 0;
    border-bottom: 1px solid var(--light-gray);
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    margin-top: 10px;
  }

  .summary-row.total {
    font-weight: 700;
    font-size: 1.2rem;
    border-top: 1px solid var(--light-gray);
    padding-top: 12px;
    margin-top: 12px;
  }

  .meta-line { font-size: 0.85rem; color: var(--gray); margin-bottom: 6px; }
  .meta-line strong { color: var(--black); font-weight: 500; }

  .action-row { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }

  .btn {
    display: block;
    padding: 14px;
    font-weight: 600;
    font-size: 0.8rem;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    text-align: center;
  }

  .btn-primary {
    background: var(--gold);
    color: var(--black);
    border: 1px solid var(--gold);
  }

  .btn-primary:hover { background: var(--gold-light); }

  .btn-secondary {
    background: var(--white);
    color: var(--black);
    border: 1px solid var(--black);
  }

  .btn-secondary:hover { background: var(--cream); }

  .empty-state { text-align: center; color: var(--gray); font-size: 0.9rem; padding: 60px 20px; }

  footer {
    background: var(--black);
    color: var(--white);
    padding: 28px 24px;
    text-align: center;
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="header-brand">
      <img src="image/logo.jpg" alt="EMB_Sparkly logo">
      <span class="brand-name">EMB_Sparkly</span>
    </a>
  </div>
</header>

<div class="page-wrap" id="confirmation-container">
  <div class="empty-state">Loading your order...</div>
</div>

<footer>
  &copy; 2026 EMB_Sparkly. All rights reserved.
</footer>

<script>
  const SUPABASE_URL = "https://vaicofjsxjrbmirrphcc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_UkqihD8tVKi5Y9Ih6n418A_6r5GhMCc";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function getOrderIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("order_id");
  }

  async function loadOrder() {
    const orderId = getOrderIdFromUrl();
    const container = document.getElementById("confirmation-container");

    if (!orderId) {
      container.innerHTML = '<div class="empty-state">No order found.</div>';
      return;
    }

    const { data: order, error } = await supabaseClient
      .from("orders")
      .select(`
        id, status, total, created_at, shipping_address, phone, customer_notes, customer_email,
        order_items ( quantity, price, products ( name ) )
      `)
      .eq("id", orderId)
      .single();

    if (error || !order) {
      container.innerHTML = '<div class="empty-state">We could not find this order.</div>';
      return;
    }

    const shortId = order.id.slice(0, 8);
    const dateStr = new Date(order.created_at).toLocaleDateString();

    let itemsHtml = "";
    let subtotal = 0;
    (order.order_items || []).forEach(function(item) {
      const lineTotal = item.price * item.quantity;
      subtotal += lineTotal;
      const productName = item.products ? item.products.name : "Item";
      itemsHtml += `
        <div class="order-line">
          <span>${item.quantity} x ${productName}</span>
          <span>$${lineTotal.toFixed(2)}</span>
        </div>
      `;
    });

    const shipping = Number(order.total) - subtotal;

    container.innerHTML = `
      <div class="success-icon">&#10003;</div>
      <div class="page-title">Order Placed</div>
      <div class="page-subtitle">Thank you, your order has been received.</div>

      <div class="card">
        <h2>Order #${shortId} &middot; ${dateStr}</h2>
        ${itemsHtml}
        <div class="summary-row"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
        <div class="summary-row"><span>Shipping</span><span>$${shipping.toFixed(2)}</span></div>
        <div class="summary-row total"><span>Total</span><span>$${Number(order.total).toFixed(2)}</span></div>
      </div>

      <div class="card">
        <h2>Delivery Details</h2>
        <div class="meta-line"><strong>Ships to:</strong> ${order.shipping_address || "Not provided"}</div>
        <div class="meta-line"><strong>Phone:</strong> ${order.phone || "Not provided"}</div>
        ${order.customer_notes ? `<div class="meta-line"><strong>Notes:</strong> ${order.customer_notes}</div>` : ""}
        <div class="meta-line"><strong>Status:</strong> ${order.status}</div>
      </div>

      <div class="action-row">
        <a href="orders.html" class="btn btn-primary">Track My Orders</a>
        <a href="catalog.html" class="btn btn-secondary">Continue Shopping</a>
      </div>
    `;
  }

  loadOrder();
</script>

</body>
</html>

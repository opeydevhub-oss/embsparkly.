<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | E.M.B Sparkly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200;6..72,400;6..72,700&family=Red+Hat+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --black: #0d2b26;
    --green: #0d2b26;
    --deep-green-dark: #081f1b;
    --white: #ffffff;
    --cream: #faf6ee;
    --gray: #6b6b64;
    --light-gray: #e5ded2;
    --accent: #c9a227;
    --gold: #c9a227;
    --gold-light: #e0c05a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Red Hat Text', sans-serif;
    background: var(--white);
    color: var(--black);
    line-height: 1.6;
  }

  h1, h2, h3, h4, h5, h6 { font-family: 'Newsreader', serif; font-weight: 200; }
  a { text-decoration: none; color: inherit; }

  header {
    background: var(--white);
    border-bottom: 1px solid var(--light-gray);
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1400px;
    margin: 0 auto;
  }

  .header-brand { display: flex; align-items: center; gap: 10px; }

  .header-brand img {
    height: 36px;
    width: 36px;
    border-radius: 50%;
    object-fit: cover;
  }

  .brand-name {
    font-family: 'Newsreader', serif;
    font-weight: 200;
    font-size: 1.6rem;
    letter-spacing: 0.06em;
    color: var(--black);
  }

  .header-nav { display: flex; align-items: center; gap: 28px; }
  .header-nav a { font-size: 0.8rem; letter-spacing: 0.13em; text-transform: uppercase; color: var(--black); }
  .header-nav a:hover { color: var(--gold); }

  .header-icons { display: flex; align-items: center; gap: 20px; }

  .icon-btn { color: var(--black); font-size: 1.1rem; position: relative; cursor: pointer; }

  .cart-count {
    position: absolute;
    top: -7px;
    right: -9px;
    background: var(--black);
    color: var(--white);
    font-size: 0.6rem;
    font-weight: 600;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .search-bar {
    max-width: 1400px;
    margin: 0 auto;
    padding: 16px 24px 0;
  }

  .search-bar input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--light-gray);
    background: var(--white);
    color: var(--black);
    font-family: 'Red Hat Text', sans-serif;
    font-size: 0.9rem;
    outline: none;
  }

  .search-bar input::placeholder { color: var(--gray); }
  .search-bar input:focus { border-color: var(--black); }

  .page-wrap { max-width: 1400px; margin: 0 auto; padding: 32px 24px 60px; }

  .page-title {
    font-size: clamp(1.8rem, 4vw, 2.4rem);
    font-weight: 200;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }

  .filter-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-top: 20px;
    margin-bottom: 24px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--light-gray);
  }

  .filter-chip {
    padding: 8px 18px;
    background: var(--white);
    border: 1px solid var(--black);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    color: var(--black);
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
  }

  .filter-chip.active {
    background: var(--black);
    color: var(--white);
    border-color: var(--black);
  }

  .result-count { font-size: 0.8rem; color: var(--gray); margin-bottom: 18px; letter-spacing: 0.06em; }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 2px;
  }

  @media (min-width: 640px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 960px) { .product-grid { grid-template-columns: repeat(4, 1fr); } }

  .product-card {
    display: block;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .product-card:hover { opacity: 0.8; }

  .product-card .img-wrap {
    width: 100%;
    aspect-ratio: 3 / 4;
    background: var(--cream);
    overflow: hidden;
    position: relative;
  }

  .product-card .card-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .product-card:hover .card-video { display: block; }

  .video-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(13,43,38,0.85);
    color: var(--gold-light);
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 20px;
    z-index: 2;
  }

  .product-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .product-card .info { padding: 14px 4px 8px; }

  .product-card h3 {
    font-family: 'Red Hat Text', sans-serif;
    font-size: 0.8rem;
    font-weight: 400;
    color: var(--black);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .product-card .price {
    font-family: 'Newsreader', serif;
    font-weight: 400;
    color: var(--black);
    font-size: 0.95rem;
    margin-top: 2px;
  }

  .product-card .low-stock-tag {
    display: inline-block;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    color: var(--gray);
    margin-top: 4px;
  }

  .empty-state {
    text-align: center;
    color: var(--gray);
    font-size: 0.9rem;
    padding: 60px 20px;
    grid-column: 1 / -1;
  }

  footer {
    background: var(--black);
    color: var(--white);
    padding: 28px 24px;
    text-align: center;
    font-size: 0.8rem;
  }

  footer a { color: rgba(255,255,255,0.55); }
  footer a:hover { color: var(--gold-light); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="header-brand">
      <img src="image/logo.jpg" alt="E.M.B Sparkly logo">
      <span class="brand-name">E.M.B Sparkly</span>
    </a>
    <div class="header-nav">
      <a href="index.html">Home</a>
      <a href="orders.html">Track Order</a>
    </div>
    <div class="header-icons">
      <a href="cart.html" class="icon-btn" title="Cart">
        &#128722;
        <span class="cart-count" id="cart-count">0</span>
      </a>
    </div>
  </div>
</header>

<div class="search-bar">
  <input type="text" id="search-input" placeholder="Search products...">
</div>

<div class="page-wrap">
  <div class="page-title">
    <span id="page-title-category">Shop</span>
  </div>

  <div class="filter-bar" id="filter-bar">
    <div class="filter-chip active" data-category="all">All</div>
    <div class="filter-chip" data-category="turkey-wears">Turkey Wears</div>
    <div class="filter-chip" data-category="dubai-wears">Dubai Wears</div>
    <div class="filter-chip" data-category="african-ready-to-wear">African Ready-to-Wear</div>
    <div class="filter-chip" data-category="women">Women</div>
    <div class="filter-chip" data-category="wigs">Wigs</div>
    <div class="filter-chip" data-category="men">Men</div>
    <div class="filter-chip" data-category="children">Children</div>
    <div class="filter-chip" data-category="jewelries">Jewelries</div>
    <div class="filter-chip" data-category="bags">Bags</div>
    <div class="filter-chip" data-category="glasses">Glasses</div>
    <div class="filter-chip" data-category="shoes">Shoes</div>
    <div class="filter-chip" data-category="bras">Bras</div>
  </div>

  <div class="result-count" id="result-count"></div>
  <div class="product-grid" id="product-grid">
    <div class="empty-state">Loading products...</div>
  </div>
</div>

<footer>
  <div style="margin-bottom:10px;">
    <a href="returns.html">Returns &amp; Refunds</a>
  </div>
  &copy; 2026 E.M.B Sparkly. All rights reserved.
</footer>

<script>
  const SUPABASE_URL = "https://vaicofjsxjrbmirrphcc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_UkqihD8tVKi5Y9Ih6n418A_6r5GhMCc";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const CART_KEY = "emb_sparkly_cart";
  function getCart() { try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch(e) { return []; } }
  const cartTotal = getCart().reduce((sum, item) => sum + item.quantity, 0);
  document.getElementById("cart-count").textContent = cartTotal;

  let allProducts = [];
  let currentCategory = "all";
  let currentSearch = "";

  const gridEl = document.getElementById("product-grid");
  const countEl = document.getElementById("result-count");

  const CATEGORY_NAMES = {
    "turkey-wears": "Turkey Wears",
    "dubai-wears": "Dubai Wears",
    "african-ready-to-wear": "African Ready-to-Wear",
    "women": "Women",
    "wigs": "Wigs",
    "men": "Men",
    "children": "Children",
    "jewelries": "Jewelries",
    "bags": "Bags & Purses",
    "glasses": "Glasses",
    "shoes": "Shoes",
    "bras": "Bras"
  };

  async function loadAllProducts() {
    const { data, error } = await supabaseClient
      .from("products")
      .select("id, name, description, price, image_url, stock, video_url, categories(slug)")
      .order("created_at", { ascending: false });

    if (error) {
      gridEl.innerHTML = '<div class="empty-state">Could not load products right now.</div>';
      return;
    }

    allProducts = data || [];
    applyFilters();
  }

  function applyFilters() {
    let filtered = allProducts;

    if (currentCategory !== "all") {
      filtered = filtered.filter(p => p.categories && p.categories.slug === currentCategory);
    }

    if (currentSearch.trim() !== "") {
      const term = currentSearch.trim().toLowerCase();
      filtered = filtered.filter(p => {
        const inName = p.name && p.name.toLowerCase().includes(term);
        const inDesc = p.description && p.description.toLowerCase().includes(term);
        return inName || inDesc;
      });
    }

    renderProducts(filtered);
  }

  function renderProducts(products) {
    countEl.textContent = products.length + (products.length === 1 ? " item" : " items");

    if (products.length === 0) {
      gridEl.innerHTML = '<div class="empty-state">No products match. Try a different search or category.</div>';
      return;
    }

    gridEl.innerHTML = "";
    products.forEach(function(product) {
      const card = document.createElement("a");
      card.href = "product.html?id=" + product.id;
      card.className = "product-card";
      const isLow = product.stock > 0 && product.stock <= 2;
      const isOut = product.stock <= 0;
      const hasVideo = !!product.video_url;
      const videoHtml = hasVideo
        ? '<span class="video-badge">&#9654; Video</span><video class="card-video" src="' + product.video_url + '" muted loop playsinline preload="none"></video>'
        : "";
      card.innerHTML = `
        <div class="img-wrap">
          ${videoHtml}
          <img src="${product.image_url}" alt="${product.name}">
        </div>
        <div class="info">
          <h3>${product.name}</h3>
          <div class="price">$${Number(product.price).toFixed(2)}</div>
          ${isOut ? '<span class="low-stock-tag">Out of stock</span>' : (isLow ? '<span class="low-stock-tag">Only ' + product.stock + ' left</span>' : '')}
        </div>
      `;

      if (hasVideo) {
        const video = card.querySelector(".card-video");
        card.addEventListener("mouseenter", function() {
          video.play().catch(function() {});
        });
        card.addEventListener("mouseleave", function() {
          video.pause();
        });
      }

      gridEl.appendChild(card);
    });
  }

  document.querySelectorAll(".filter-chip").forEach(function(chip) {
    chip.addEventListener("click", function() {
      document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      currentCategory = chip.dataset.category;
      const titleEl = document.getElementById("page-title-category");
      titleEl.textContent = currentCategory === "all" ? "Shop" : (CATEGORY_NAMES[currentCategory] || "Shop");
      applyFilters();
    });
  });

  document.getElementById("search-input").addEventListener("input", function(e) {
    currentSearch = e.target.value;
    applyFilters();
  });

  function initFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const catParam = params.get("category");
    const searchParam = params.get("search");

    if (catParam) {
      currentCategory = catParam;
      const matchChip = document.querySelector(`.filter-chip[data-category="${catParam}"]`);
      if (matchChip) {
        document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
        matchChip.classList.add("active");
      }
      const titleEl = document.getElementById("page-title-category");
      titleEl.textContent = CATEGORY_NAMES[catParam] || "Shop";
    }

    if (searchParam) {
      currentSearch = searchParam;
      document.getElementById("search-input").value = searchParam;
    }
  }

  initFromUrl();
  loadAllProducts();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | E.M.B SPARKLY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --deep-green: #0d2b26;
    --deep-green-dark: #081f1b;
    --gold: #c9a227;
    --gold-light: #e0c05a;
    --cream: #faf6ee;
    --charcoal: #1a1a1a;
    --gray: #6b6b64;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--cream);
    color: var(--charcoal);
    line-height: 1.5;
  }

  h1, h2, h3, .brand-name { font-family: 'Cormorant Garamond', serif; }
  a { text-decoration: none; color: inherit; }

  header {
    background: var(--deep-green);
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .header-brand { display: flex; align-items: center; gap: 10px; }

  .header-brand img {
    height: 38px;
    width: 38px;
    border-radius: 50%;
    object-fit: cover;
  }

  .brand-name { color: var(--gold-light); font-size: 1.5rem; font-weight: 700; }

  .header-icons { display: flex; align-items: center; gap: 16px; }

  .icon-btn { color: var(--cream); font-size: 1.2rem; position: relative; cursor: pointer; }

  .cart-count {
    position: absolute;
    top: -8px;
    right: -10px;
    background: var(--gold);
    color: var(--deep-green-dark);
    font-size: 0.65rem;
    font-weight: 600;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .search-bar {
    margin-top: 12px;
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
  }

  .search-bar input {
    width: 100%;
    padding: 11px 16px;
    border-radius: 24px;
    border: 1px solid rgba(201,162,39,0.4);
    background: rgba(255,255,255,0.08);
    color: var(--cream);
    font-family: 'Jost', sans-serif;
    font-size: 0.95rem;
    outline: none;
  }

  .search-bar input::placeholder { color: rgba(250,246,238,0.55); }
  .search-bar input:focus { border-color: var(--gold); background: rgba(255,255,255,0.12); }

  .page-wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }

  .page-title { font-size: 1.5rem; font-weight: 600; color: var(--deep-green); margin-bottom: 4px; }
  .page-subtitle { font-size: 0.85rem; color: var(--gray); margin-bottom: 18px; }

  .filter-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 22px;
    padding-bottom: 6px;
  }

  .filter-chip {
    padding: 7px 16px;
    border-radius: 18px;
    border: 1px solid rgba(13,43,38,0.15);
    background: #fff;
    font-size: 0.8rem;
    color: var(--gray);
    white-space: nowrap;
    cursor: pointer;
  }

  .filter-chip.active {
    background: var(--deep-green);
    color: var(--gold-light);
    border-color: var(--deep-green);
  }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  @media (min-width: 640px) {
    .product-grid { grid-template-columns: repeat(3, 1fr); }
  }

  @media (min-width: 960px) {
    .product-grid { grid-template-columns: repeat(5, 1fr); }
  }

  .product-card {
    background: #fff;
    border: 1px solid rgba(13,43,38,0.08);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
    display: block;
  }

  .product-card:hover { transform: translateY(-3px); border-color: var(--gold); }

  .product-card .img-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #eee;
    overflow: hidden;
    position: relative;
  }

  .product-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .out-of-stock-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(179,65,59,0.9);
    color: #fff;
    font-size: 0.65rem;
    padding: 3px 8px;
    border-radius: 10px;
  }

  .product-card .info { padding: 10px 12px 14px; }

  .product-card h3 {
    font-family: 'Jost', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--charcoal);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .product-card .price {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    color: var(--deep-green);
    font-size: 1.05rem;
    margin-top: 3px;
  }

  .empty-state { text-align: center; color: var(--gray); font-size: 0.9rem; padding: 60px 20px; grid-column: 1 / -1; }

  footer {
    background: var(--deep-green-dark);
    color: rgba(250,246,238,0.75);
    padding: 32px 20px 20px;
    text-align: center;
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <a href="index.html" class="header-brand">
      <img src="image/logo.jpg" alt="E.M.B SPARKLY logo">
      <span class="brand-name">E.M.B SPARKLY</span>
    </a>
    <div class="header-icons">
      <a href="cart.html" class="icon-btn" title="Cart">
        &#128722;
        <span class="cart-count" id="cart-count">0</span>
      </a>
    </div>
  </div>
  <div class="search-bar">
    <input type="text" id="catalog-search" placeholder="Search products, e.g. 'Ankara gown', 'gele'...">
  </div>
</header>

<div class="page-wrap">
  <div class="page-title" id="page-title">Shop All</div>
  <div class="page-subtitle" id="page-subtitle">Browse everything we have</div>

  <div class="filter-bar" id="filter-bar">
    <div class="filter-chip" data-category="">All</div>
    <div class="filter-chip" data-category="turkey-wears">Turkey Wears</div>
    <div class="filter-chip" data-category="dubai-wears">Dubai Wears</div>
    <div class="filter-chip" data-category="african-ready-to-wear">African Ready-to-Wear</div>
    <div class="filter-chip" data-category="women">Women</div>
    <div class="filter-chip" data-category="wigs">Wigs</div>
    <div class="filter-chip" data-category="men">Men</div>
    <div class="filter-chip" data-category="children">Children</div>
    <div class="filter-chip" data-category="jewelries">Jewelries</div>
    <div class="filter-chip" data-category="bags">Bags &amp; Purses</div>
    <div class="filter-chip" data-category="glasses">Glasses</div>
    <div class="filter-chip" data-category="shoes">Shoes</div>
  </div>

  <div class="product-grid" id="product-grid">
    <div class="empty-state">Loading products...</div>
  </div>
</div>

<footer>
  &copy; 2026 E.M.B SPARKLY. All rights reserved.
</footer>

<script>
  const SUPABASE_URL = "https://vaicofjsxjrbmirrphcc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_UkqihD8tVKi5Y9Ih6n418A_6r5GhMCc";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const CART_KEY = "emb_sparkly_cart";

  function getCart() {
    try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; }
    catch (e) { return []; }
  }

  function updateCartCountBadge() {
    const cart = getCart();
    const totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
    document.getElementById("cart-count").textContent = totalQty;
  }

  updateCartCountBadge();

  const params = new URLSearchParams(window.location.search);
  let activeCategory = params.get("category") || "";
  let activeSearch = params.get("search") || "";

  document.getElementById("catalog-search").value = activeSearch;

  function setActiveChip() {
    document.querySelectorAll(".filter-chip").forEach(function(chip) {
      chip.classList.toggle("active", chip.dataset.category === activeCategory);
    });
  }

  document.querySelectorAll(".filter-chip").forEach(function(chip) {
    chip.addEventListener("click", function() {
      activeCategory = chip.dataset.category;
      setActiveChip();
      updatePageHeading();
      loadProducts();
    });
  });

  document.getElementById("catalog-search").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      activeSearch = e.target.value.trim();
      updatePageHeading();
      loadProducts();
    }
  });

  function updatePageHeading() {
    const titleEl = document.getElementById("page-title");
    const subtitleEl = document.getElementById("page-subtitle");

    if (activeSearch) {
      titleEl.textContent = 'Results for "' + activeSearch + '"';
      subtitleEl.textContent = "Search results";
    } else if (activeCategory) {
      const chip = document.querySelector('.filter-chip[data-category="' + activeCategory + '"]');
      titleEl.textContent = chip ? chip.textContent : "Shop";
      subtitleEl.textContent = "Browsing this category";
    } else {
      titleEl.textContent = "Shop All";
      subtitleEl.textContent = "Browse everything we have";
    }
  }

  async function loadProducts() {
    const gridEl = document.getElementById("product-grid");
    gridEl.innerHTML = '<div class="empty-state">Loading products...</div>';

    let query = supabaseClient
      .from("products")
      .select("id, name, price, image_url, stock, category_id, categories(slug)")
      .order("created_at", { ascending: false });

    if (activeSearch) {
      query = query.ilike("name", "%" + activeSearch + "%");
    }

    const { data: products, error } = await query;

    if (error) {
      gridEl.innerHTML = '<div class="empty-state">Could not load products right now.</div>';
      return;
    }

    let filtered = products || [];
    if (activeCategory) {
      filtered = filtered.filter(function(p) {
        return p.categories && p.categories.slug === activeCategory;
      });
    }

    if (filtered.length === 0) {
      gridEl.innerHTML = '<div class="empty-state">No products found. Try a different category or search term.</div>';
      return;
    }

    gridEl.innerHTML = "";
    filtered.forEach(function(product) {
      const card = document.createElement("a");
      card.href = "product.html?id=" + product.id;
      card.className = "product-card";
      card.innerHTML = `
        <div class="img-wrap">
          ${product.stock <= 0 ? '<span class="out-of-stock-badge">Out of Stock</span>' : ''}
          <img src="${product.image_url}" alt="${product.name}">
        </div>
        <div class="info">
          <h3>${product.name}</h3>
          <div class="price">$${Number(product.price).toFixed(2)}</div>
        </div>
      `;
      gridEl.appendChild(card);
    });
  }

  setActiveChip();
  updatePageHeading();
  loadProducts();
</script>

</body>
</html>

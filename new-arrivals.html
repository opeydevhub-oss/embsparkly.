<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Arrivals | E.M.B SPARKLY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200;6..72,400;6..72,700&family=Red+Hat+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --black: #0d2b26;
    --green: #0d2b26;
    --deep-green-dark: #081f1b;
    --white: #ffffff;
    --cream: #faf6ee;
    --gray: #6b6b64;
    --light-gray: #e5ded2;
    --accent: #c9a227;
    --gold: #c9a227;
    --gold-light: #e0c05a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Red Hat Text', sans-serif;
    background: var(--white);
    color: var(--black);
    line-height: 1.6;
  }

  h1, h2, h3, h4, h5, h6 { font-family: 'Newsreader', serif; font-weight: 200; }
  a { text-decoration: none; color: inherit; }

  header {
    background: var(--white);
    border-bottom: 1px solid var(--light-gray);
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1400px;
    margin: 0 auto;
  }

  .header-brand { display: flex; align-items: center; gap: 10px; }

  .header-brand img {
    height: 36px;
    width: 36px;
    border-radius: 50%;
    object-fit: cover;
  }

  .brand-name {
    font-family: 'Newsreader', serif;
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing: 0.04em;
    color: var(--black);
  }

  .header-nav { display: flex; align-items: center; gap: 28px; }
  .header-nav a { font-size: 0.8rem; letter-spacing: 0.13em; text-transform: uppercase; color: var(--black); }
  .header-nav a:hover { color: var(--gold); }

  .header-icons { display: flex; align-items: center; gap: 20px; }

  .icon-btn { color: var(--black); font-size: 1.1rem; position: relative; cursor: pointer; }

  .cart-count {
    position: absolute;
    top: -7px;
    right: -9px;
    background: var(--black);
    color: var(--white);
    font-size: 0.6rem;
    font-weight: 600;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .search-bar {
    max-width: 1400px;
    margin: 0 auto;
    padding: 16px 24px 0;
  }

  .search-bar input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--light-gray);
    background: var(--white);
    color: var(--black);
    font-family: 'Red Hat Text', sans-serif;
    font-size: 0.9rem;
    outline: none;
  }

  .search-bar input::placeholder { color: var(--gray); }
  .search-bar input:focus { border-color: var(--black); }

  .page-wrap { max-width: 1400px; margin: 0 auto; padding: 32px 24px 60px; }

  .page-title {
    font-size: clamp(1.8rem, 4vw, 2.4rem);
    font-weight: 200;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }

  .filter-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-top: 20px;
    margin-bottom: 24px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--light-gray);
  }

  .filter-chip {
    padding: 8px 18px;
    background: var(--white);
    border: 1px solid var(--black);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    color: var(--black);
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
  }

  .filter-chip.active {
    background: var(--black);
    color: var(--white);
    border-color: var(--black);
  }

  .result-count { font-size: 0.8rem; color: var(--gray); margin-bottom: 18px; letter-spacing: 0.06em; }

  .page-subtitle {
    font-family: 'Red Hat Text', sans-serif;
    font-size: 0.9rem;
    color: var(--gray);
    margin-bottom: 24px;
  }

  .new-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--gold, #c9a227);
    color: #fff;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 20px;
    z-index: 2;
  }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 2px;
  }

  @media (min-width: 640px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 960px) { .product-grid { grid-template-columns: repeat(4, 1fr); } }

  .product-card {
    display: block;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .product-card:hover { opacity: 0.8; }

  .product-card .img-wrap {
    width: 100%;
    aspect-ratio: 3 / 4;
    background: var(--cream);
    overflow: hidden;
    position: relative;
  }

  .product-card .card-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .product-card:hover .card-video { display: block; }

  .video-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(13,43,38,0.85);
    color: var(--gold-light);
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 20px;
    z-index: 2;
  }

  .product-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .product-card .info { padding: 14px 4px 8px; }

  .product-card h3 {
    font-family: 'Red Hat Text', sans-serif;
    font-size: 0.8rem;
    font-weight: 400;
    color: var(--black);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .product-card .price {
    font-family: 'Newsreader', serif;
    font-weight: 400;
    color: var(--black);
    font-size: 0.95rem;
    margin-top: 2px;
  }

  .product-card .low-stock-tag {
    display: inline-block;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    color: var(--gray);
    margin-top: 4px;
  }

  .empty-state {
    text-align: center;
    color: var(--gray);
    font-size: 0.9rem;
    padding: 60px 20px;
    grid-column: 1 / -1;
  }

  footer {
    background: var(--black);
    color: var(--white);
    padding: 28px 24px;
    text-align: center;
    font-size: 0.8rem;
  }

  footer a { color: rgba(255,255,255,0.55); }
  footer a:hover { color: var(--gold-light); }
.site-notice-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    background: var(--gold, #d9b26b);
    color: var(--deep-green, #0e3029);
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 600;
  }

  .site-notice-close {
    background: none;
    border: none;
    color: inherit;
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
    flex: 0 0 auto;
  }

  .menu-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.5rem;
    line-height: 1;
    padding: 0;
    min-width: 40px;
    text-align: left;
    color: var(--gold-light, currentColor);
  }

  .menu-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    opacity: 0;
    visibility: hidden;
    transition: opacity .25s ease, visibility .25s ease;
    z-index: 9999;
  }

  .menu-backdrop.show { opacity: 1; visibility: visible; }

  .menu-drawer {
    position: fixed;
    top: 0;
    left: 0;
    height: 100%;
    width: min(300px, 84vw);
    background: var(--cream, #faf6ee);
    color: var(--deep-green-dark, #081c18);
    transform: translateX(-100%);
    transition: transform .28s ease;
    z-index: 10000;
    overflow-y: auto;
    padding: 20px 18px;
  }

  .menu-drawer.open { transform: translateX(0); }

  .menu-drawer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .menu-drawer-title {
    font-family: 'Newsreader', serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .menu-drawer-close {
    background: none;
    border: none;
    font-size: 1.7rem;
    line-height: 1;
    cursor: pointer;
    color: inherit;
    padding: 0 4px;
  }

  .menu-links { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }

  .menu-links a {
    padding: 10px 4px;
    font-size: 1rem;
    letter-spacing: 0.02em;
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  }

  .menu-links a:hover { color: var(--gold, #b8860b); }

  .menu-cat-title {
    font-size: 0.75rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gray, #8a8a7e);
    margin: 10px 0 8px;
  }

  .menu-categories { display: flex; flex-direction: column; gap: 2px; }

  .menu-cat-link {
    padding: 9px 4px;
    color: inherit;
    text-decoration: none;
    font-size: 0.95rem;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
  }

  .menu-cat-link:hover { color: var(--gold, #b8860b); }

  .menu-cat-empty { color: var(--gray, #8a8a7e); font-size: 0.85rem; padding: 6px 4px; }

  .header-inner { position: relative; }
  .header-inner .header-brand { position: absolute; left: 50%; transform: translateX(-50%); margin: 0; }
  .header-inner .header-icons { margin-left: auto; }
</style>
</head>
<body>

<div id="site-notice"></div>
<div class="menu-backdrop" id="menu-backdrop"></div>
<nav class="menu-drawer" id="menu-drawer" aria-label="Site menu">
  <div class="menu-drawer-head">
    <span class="menu-drawer-title">Menu</span>
    <button type="button" class="menu-drawer-close" id="menu-close" aria-label="Close menu">&times;</button>
  </div>
  <div class="menu-links">
    <a href="index.html">Home</a>
    <a href="catalog.html">Shop</a>
    <a href="new-arrivals.html">New Arrivals</a>
    <a href="orders.html">Track Order</a>
    <a href="index.html#about">About</a>
    <a href="https://wa.me/message/NKLSS5LINWZ2H1" target="_blank" rel="noopener">WhatsApp Us</a>
  </div>
  <div class="menu-cat-title">Categories</div>
  <div class="menu-categories" id="menu-categories"><div class="menu-cat-empty">Loading...</div></div>
</nav>

<header>
  <div class="header-inner">
    <button type="button" class="menu-btn" id="menu-btn" title="Menu" aria-label="Open menu">&#9776;</button>
    <a href="index.html" class="header-brand">
      <img src="image/logo.jpg" alt="E.M.B SPARKLY logo">
      <span class="brand-name">E.M.B SPARKLY</span>
    </a>
    <div class="header-icons">
      <a href="cart.html" class="icon-btn" title="Cart">
        &#128722;
        <span class="cart-count" id="cart-count">0</span>
      </a>
    </div>
  </div>
</header>

<div class="search-bar">
  <input type="text" id="search-input" placeholder="Search products...">
</div>

<div class="page-wrap">
  <div class="page-title">New Arrivals</div>
  <div class="page-subtitle">The latest pieces added to the store, newest first.</div>

  <div class="result-count" id="result-count"></div>
  <div class="product-grid" id="product-grid">
    <div class="empty-state">Loading products...</div>
  </div>
</div>

<footer>
  <div style="margin-bottom:10px;">
    <a href="returns.html">Returns &amp; Refunds</a>
  </div>
  &copy; 2026 E.M.B SPARKLY. All rights reserved.
</footer>

<script>
  const SUPABASE_URL = "https://vaicofjsxjrbmirrphcc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_UkqihD8tVKi5Y9Ih6n418A_6r5GhMCc";

  /* SITE MENU + NOTIFICATIONS */
  (function() {
    var menuBtn = document.getElementById("menu-btn");
    var drawer = document.getElementById("menu-drawer");
    var backdrop = document.getElementById("menu-backdrop");
    var closeBtn = document.getElementById("menu-close");
    if (!menuBtn || !drawer || !backdrop || !closeBtn) return;

    function openMenu() { drawer.classList.add("open"); backdrop.classList.add("show"); }
    function closeMenu() { drawer.classList.remove("open"); backdrop.classList.remove("show"); }
    menuBtn.addEventListener("click", openMenu);
    closeBtn.addEventListener("click", closeMenu);
    backdrop.addEventListener("click", closeMenu);
    document.addEventListener("keydown", function(e) { if (e.key === "Escape") closeMenu(); });

    if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
      var client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      var catBox = document.getElementById("menu-categories");
      if (catBox) {
        client.from("categories").select("name, slug").order("name").then(function(res) {
          if (res.error || !res.data || res.data.length === 0) {
            catBox.innerHTML = '<div class="menu-cat-empty">Categories coming soon.</div>';
            return;
          }
          catBox.innerHTML = "";
          res.data.forEach(function(c) {
            var a = document.createElement("a");
            a.className = "menu-cat-link";
            a.href = "catalog.html?category=" + encodeURIComponent(c.slug);
            a.textContent = c.name;
            catBox.appendChild(a);
          });
        });
      }

      var notice = document.getElementById("site-notice");
      if (notice) {
        client.from("site_notifications").select("id, message").eq("is_active", true)
          .order("created_at", { ascending: false }).limit(1).then(function(res) {
            if (res.error || !res.data || res.data.length === 0) return;
            var n = res.data[0];
            var key = "emb_notice_closed_" + n.id;
            try { if (localStorage.getItem(key) === "1") return; } catch (e) {}
            var bar = document.createElement("div");
            bar.className = "site-notice-bar";
            var msg = document.createElement("span");
            msg.textContent = n.message;
            var x = document.createElement("button");
            x.type = "button";
            x.className = "site-notice-close";
            x.title = "Dismiss";
            x.innerHTML = "&times;";
            x.addEventListener("click", function() {
              try { localStorage.setItem(key, "1"); } catch (e) {}
              bar.remove();
            });
            bar.appendChild(msg);
            bar.appendChild(x);
            notice.appendChild(bar);
          });
      }
    }
  })();
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const CART_KEY = "emb_sparkly_cart";
  function getCart() { try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch(e) { return []; } }
  const cartTotal = getCart().reduce((sum, item) => sum + item.quantity, 0);
  document.getElementById("cart-count").textContent = cartTotal;

  let allProducts = [];
  let currentSearch = "";

  const gridEl = document.getElementById("product-grid");
  const countEl = document.getElementById("result-count");

  async function loadNewArrivals() {
    const { data, error } = await supabaseClient
      .from("products")
      .select("id, name, description, price, image_url, stock, video_url")
      .order("created_at", { ascending: false })
      .limit(36);

    if (error) {
      gridEl.innerHTML = '<div class="empty-state">Could not load products right now.</div>';
      return;
    }

    allProducts = data || [];
    applyFilters();
  }

  function applyFilters() {
    let filtered = allProducts;

    if (currentSearch.trim() !== "") {
      const term = currentSearch.trim().toLowerCase();
      filtered = filtered.filter(p => {
        const inName = p.name && p.name.toLowerCase().includes(term);
        const inDesc = p.description && p.description.toLowerCase().includes(term);
        return inName || inDesc;
      });
    }

    renderProducts(filtered);
  }

  function renderProducts(products) {
    countEl.textContent = products.length + (products.length === 1 ? " item" : " items");

    if (products.length === 0) {
      gridEl.innerHTML = '<div class="empty-state">No products match. Try a different search.</div>';
      return;
    }

    gridEl.innerHTML = "";
    products.forEach(function(product) {
      const card = document.createElement("a");
      card.href = "product.html?id=" + product.id;
      card.className = "product-card";
      const isLow = product.stock > 0 && product.stock <= 2;
      const isOut = product.stock <= 0;
      const hasVideo = !!product.video_url;
      const imgHtml = product.image_url ? '<img src="' + product.image_url + '" alt="' + product.name + '">' : "";
      const videoHtml = hasVideo
        ? '<span class="video-badge">&#9654; Video</span><video class="card-video" src="' + product.video_url + '" autoplay muted loop playsinline preload="auto"></video>'
        : "";
      card.innerHTML = `
        <div class="img-wrap">
          ${videoHtml}
          <span class="new-badge">New</span>
          ${imgHtml}
        </div>
        <div class="info">
          <h3>${product.name}</h3>
          <div class="price">$${Number(product.price).toFixed(2)}</div>
          ${isOut ? '<span class="low-stock-tag">Out of stock</span>' : (isLow ? '<span class="low-stock-tag">Only ' + product.stock + ' left</span>' : '')}
        </div>
      `;

      if (hasVideo) {
        const video = card.querySelector(".card-video");
        card.addEventListener("mouseenter", function() {
          video.play().catch(function() {});
        });
        card.addEventListener("mouseleave", function() {
          video.pause();
        });
      }

      gridEl.appendChild(card);
    });
  }

  document.getElementById("search-input").addEventListener("input", function(e) {
    currentSearch = e.target.value;
    applyFilters();
  });

  loadNewArrivals();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | EMB_Sparkly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --deep-green: #0d2b26;
    --deep-green-dark: #081f1b;
    --gold: #c9a227;
    --gold-light: #e0c05a;
    --cream: #faf6ee;
    --charcoal: #1a1a1a;
    --gray: #6b6b64;
    --error: #b3413b;
    --success: #2f7a4f;
    --warning: #b5850f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--cream);
    color: var(--charcoal);
    min-height: 100vh;
  }

  h1, h2, .brand-name { font-family: 'Cormorant Garamond', serif; }

  header {
    background: var(--deep-green);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .header-brand { display: flex; align-items: center; gap: 10px; }

  .header-brand img {
    height: 34px;
    width: 34px;
    border-radius: 50%;
    object-fit: cover;
  }

  .brand-name { color: var(--gold-light); font-size: 1.3rem; font-weight: 700; }

  .logout-btn {
    background: transparent;
    border: 1px solid rgba(201,162,39,0.5);
    color: var(--gold-light);
    padding: 7px 14px;
    border-radius: 20px;
    font-family: 'Jost', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
  }

  #gate-screen {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }

  #gate-screen p { color: var(--gray); max-width: 320px; }

  #gate-screen a {
    display: inline-block;
    margin-top: 14px;
    background: var(--deep-green);
    color: var(--gold-light);
    padding: 10px 22px;
    border-radius: 5px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
  }

  main { display: none; }

  .tab-bar {
    display: flex;
    background: #fff;
    border-bottom: 1px solid rgba(13,43,38,0.1);
    position: sticky;
    top: 62px;
    z-index: 40;
    overflow-x: auto;
  }

  .tab-btn {
    flex: 1;
    padding: 13px 10px;
    text-align: center;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--gray);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
  }

  .tab-btn.active {
    color: var(--deep-green);
    border-bottom-color: var(--gold);
    font-weight: 600;
  }

  .tab-panel { display: none; max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
  .tab-panel.active { display: block; }

  .page-title { font-size: 1.5rem; font-weight: 600; color: var(--deep-green); margin-bottom: 4px; }
  .page-subtitle { color: var(--gray); font-size: 0.85rem; margin-bottom: 22px; }

  .card {
    background: #fff;
    border-radius: 8px;
    padding: 20px;
    border: 1px solid rgba(13,43,38,0.08);
    margin-bottom: 22px;
  }

  .card h2 { font-size: 1.1rem; color: var(--deep-green); margin-bottom: 14px; }

  label { display: block; font-size: 0.8rem; margin-bottom: 5px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }

  .hint { font-size: 0.72rem; color: var(--gray); margin-top: 4px; }

  input, textarea, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 5px;
    border: 1px solid rgba(13,43,38,0.18);
    font-family: 'Jost', sans-serif;
    font-size: 0.9rem;
    outline: none;
    background: #fff;
    color: var(--charcoal);
  }

  input:focus, textarea:focus, select:focus { border-color: var(--gold); }
  textarea { resize: vertical; min-height: 70px; }

  .submit-btn {
    width: 100%;
    margin-top: 18px;
    padding: 12px;
    background: var(--deep-green);
    color: var(--gold-light);
    border: none;
    border-radius: 5px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }

  .submit-btn:hover { background: var(--deep-green-dark); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .form-message { margin-top: 12px; font-size: 0.83rem; display: none; text-align: center; }
  .form-message.error { color: var(--error); display: block; }
  .form-message.success { color: var(--success); display: block; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  @media (min-width: 600px) {
    .stats-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .stat-box {
    background: #fff;
    border: 1px solid rgba(13,43,38,0.08);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
  }

  .stat-box .value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--deep-green);
  }

  .stat-box .label { font-size: 0.75rem; color: var(--gray); margin-top: 2px; }

  .product-list, .order-list { display: flex; flex-direction: column; gap: 12px; }

  .product-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border: 1px solid rgba(13,43,38,0.08);
    border-radius: 6px;
  }

  .product-row.low-stock { border-color: rgba(181,133,15,0.5); background: #fffaf0; }

  .product-row img {
    width: 52px; height: 52px;
    object-fit: cover;
    border-radius: 5px;
    background: #eee;
    flex-shrink: 0;
  }

  .product-row .info { flex: 1; min-width: 0; }

  .product-row .info h3 {
    font-size: 0.9rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .product-row .info p { font-size: 0.78rem; color: var(--gray); }

  .video-badge {
    font-size: 0.68rem;
    padding: 2px 7px;
    border-radius: 10px;
    background: #e4edf7;
    color: #2a5da0;
    margin-left: 4px;
  }

  .stock-badge {
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 10px;
    background: #fdecea;
    color: var(--error);
    margin-left: 6px;
  }

  .delete-btn {
    background: none;
    border: 1px solid rgba(179,65,59,0.4);
    color: var(--error);
    padding: 6px 12px;
    border-radius: 16px;
    font-size: 0.75rem;
    cursor: pointer;
    flex-shrink: 0;
  }

  .empty-state { text-align: center; color: var(--gray); font-size: 0.85rem; padding: 20px 0; }

  .order-card {
    border: 1px solid rgba(13,43,38,0.1);
    border-radius: 8px;
    padding: 16px;
    background: #fff;
  }

  .order-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }

  .order-id { font-size: 0.78rem; color: var(--gray); }
  .order-total { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 1.2rem; color: var(--deep-green); }

  .status-pill {
    display: inline-block;
    font-size: 0.72rem;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 600;
    text-transform: capitalize;
  }

  .status-pending { background: #fdf3d9; color: var(--warning); }
  .status-processing { background: #e4edf7; color: #2a5da0; }
  .status-shipped { background: #e6f0ff; color: #3255a8; }
  .status-delivered { background: #e3f3e8; color: var(--success); }
  .status-cancelled { background: #fdecea; color: var(--error); }

  .order-items-list { font-size: 0.82rem; color: var(--charcoal); margin: 8px 0; }
  .order-items-list div { padding: 2px 0; }

  .order-meta { font-size: 0.78rem; color: var(--gray); margin-bottom: 10px; }
  .order-meta div { margin-bottom: 2px; }

  .order-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .order-actions select { flex: 1; min-width: 130px; padding: 8px 10px; font-size: 0.82rem; }

  .whatsapp-btn {
    background: #25D366;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }

  .filter-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 18px;
    padding-bottom: 4px;
  }

  .filter-chip {
    padding: 6px 14px;
    border-radius: 16px;
    border: 1px solid rgba(13,43,38,0.15);
    background: #fff;
    font-size: 0.78rem;
    color: var(--gray);
    white-space: nowrap;
    cursor: pointer;
  }

  .filter-chip.active {
    background: var(--deep-green);
    color: var(--gold-light);
    border-color: var(--deep-green);
  }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <img src="image/logo.jpg" alt="EMB_Sparkly logo">
    <span class="brand-name">Admin Dashboard</span>
  </div>
  <button class="logout-btn" id="logout-btn">Log Out</button>
</header>

<div id="gate-screen">
  <div>
    <p id="gate-message">Checking your access...</p>
    <a href="login.html" id="gate-login-link" style="display:none;">Go to Login</a>
  </div>
</div>

<main id="admin-main">

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="orders">Orders</button>
    <button class="tab-btn" data-tab="products">Products</button>
  </div>

  <div class="tab-panel active" id="tab-overview">
    <div class="page-title">Overview</div>
    <div class="page-subtitle">A quick look at how the shop is doing</div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="value" id="stat-total-orders">0</div>
        <div class="label">Total Orders</div>
      </div>
      <div class="stat-box">
        <div class="value" id="stat-pending-orders">0</div>
        <div class="label">Pending</div>
      </div>
      <div class="stat-box">
        <div class="value" id="stat-revenue">$0</div>
        <div class="label">Total Revenue</div>
      </div>
      <div class="stat-box">
        <div class="value" id="stat-low-stock">0</div>
        <div class="label">Low Stock Items</div>
      </div>
    </div>

    <div class="card">
      <h2>Recent Orders</h2>
      <div class="order-list" id="recent-orders-list">
        <div class="empty-state">Loading...</div>
      </div>
    </div>
  </div>

  <div class="tab-panel"

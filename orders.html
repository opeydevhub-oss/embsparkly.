<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders | EMB_Sparkly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200;6..72,400;6..72,700&family=Red+Hat+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --black: #0d2b26;
    --white: #ffffff;
    --cream: #faf6ee;
    --gray: #6b6b64;
    --light-gray: #e5ded2;
    --accent: #c9a227;
    --gold: #c9a227;
    --gold-light: #e0c05a;
    --success: #2f7a4f;
    --warning: #b5850f;
    --error: #b3413b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Red Hat Text', sans-serif;
    background: var(--white);
    color: var(--black);
    line-height: 1.6;
  }

  h1, h2, h3, h4, h5, h6 { font-family: 'Newsreader', serif; font-weight: 200; }
  a { text-decoration: none; color: inherit; }

  header {
    background: var(--white);
    border-bottom: 1px solid var(--light-gray);
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1400px;
    margin: 0 auto;
  }

  .header-brand { display: flex; align-items: center; gap: 10px; }

  .header-brand img {
    height: 36px;
    width: 36px;
    border-radius: 50%;
    object-fit: cover;
  }

  .brand-name {
    font-family: 'Newsreader', serif;
    font-weight: 200;
    font-size: 1.6rem;
    letter-spacing: 0.06em;
    color: var(--black);
  }

  .logout-btn {
    background: transparent;
    border: 1px solid var(--black);
    color: var(--black);
    padding: 8px 18px;
    font-family: 'Red Hat Text', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .logout-btn:hover { background: var(--black); color: var(--white); }

  .page-wrap { max-width: 800px; margin: 0 auto; padding: 32px 24px 60px; }

  .page-title {
    font-size: clamp(1.8rem, 4vw, 2.4rem);
    font-weight: 200;
    letter-spacing: 0.06em;
    margin-bottom: 28px;
  }

  .order-card {
    border-top: 1px solid var(--black);
    padding: 18px 0;
    margin-bottom: 8px;
  }

  .order-card:last-of-type { border-bottom: 1px solid var(--black); }

  .order-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }

  .order-id { font-size: 0.78rem; letter-spacing: 0.13em; text-transform: uppercase; color: var(--gray); }
  .order-date { font-size: 0.75rem; color: var(--gray); margin-top: 2px; }

  .order-total {
    font-weight: 700;
    font-size: 1.2rem;
  }

  .status-pill {
    display: inline-block;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 12px;
    font-weight: 600;
    margin-top: 6px;
  }

  .status-pending { background: #fdf3d9; color: var(--warning); }
  .status-processing { background: #e4edf7; color: #2a5da0; }
  .status-shipped { background: #e6f0ff; color: #3255a8; }
  .status-delivered { background: #e3f3e8; color: var(--success); }
  .status-cancelled { background: #fdecea; color: var(--error); }

  .order-items-list { font-size: 0.82rem; color: var(--black); margin: 8px 0; }
  .order-items-list div { padding: 2px 0; }

  .order-meta { font-size: 0.78rem; color: var(--gray); margin-top: 8px; }

  .empty-state {
    text-align: center;
    color: var(--gray);
    font-size: 0.9rem;
    padding: 60px 20px;
  }

  .empty-state a {
    display: inline-block;
    margin-top: 16px;
    background: var(--gold);
    color: var(--black);
    padding: 12px 30px;
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.13em;
    text-transform: uppercase;
  }

  .empty-state a:hover { background: var(--gold-light); }

  footer {
    background: var(--black);
    color: var(--white);
    padding: 28px 24px;
    text-align: center;
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="header-brand">
      <img src="image/logo.jpg" alt="EMB_Sparkly logo">
      <span class="brand-name">EMB_Sparkly</span>
    </a>
    <a href="catalog.html" class="logout-btn">Shop</a>
  </div>
</header>

<div class="page-wrap">
  <div class="page-title">My Orders</div>
  <div id="orders-container">
    <div class="empty-state">Loading your orders...</div>
  </div>
</div>

<footer>
  &copy; 2026 EMB_Sparkly. All rights reserved.
</footer>

<script>
  const SUPABASE_URL = "https://vaicofjsxjrbmirrphcc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_UkqihD8tVKi5Y9Ih6n418A_6r5GhMCc";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function loadOrders() {
    const container = document.getElementById("orders-container");
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
      container.innerHTML = `
        <div class="empty-state">
          Please log in to view your orders.
          <br>
          <a href="login.html?redirect=orders.html">Log In</a>
        </div>
      `;
      return;
    }

    const { data: orders, error } = await supabaseClient
      .from("orders")
      .select(`
        id, status, total, created_at, shipping_address, phone,
        order_items ( quantity, price, products ( name ) )
      `)
      .eq("user_id", session.user.id)
      .order("created_at", { ascending: false });

    if (error) {
      container.innerHTML = '<div class="empty-state">Could not load your orders right now.</div>';
      return;
    }

    if (!orders || orders.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          You have not placed any orders yet.
          <br>
          <a href="catalog.html">Start Shopping</a>
        </div>
      `;
      return;
    }

    container.innerHTML = "";
    orders.forEach(function(order) {
      const shortId = order.id.slice(0, 8);
      const dateStr = new Date(order.created_at).toLocaleDateString();

      const itemsHtml = (order.order_items || []).map(function(item) {
        const productName = item.products ? item.products.name : "Item";
        return `<div>${item.quantity} x ${productName} - $${Number(item.price).toFixed(2)}</div>`;
      }).join("");

      const card = document.createElement("div");
      card.className = "order-card";
      card.innerHTML = `
        <div class="order-card-top">
          <div>
            <div class="order-id">Order #${shortId}</div>
            <div class="order-date">${dateStr}</div>
            <span class="status-pill status-${order.status}">${order.status}</span>
          </div>
          <div class="order-total">$${Number(order.total).toFixed(2)}</div>
        </div>
        <div class="order-items-list">${itemsHtml || "<div>No items recorded</div>"}</div>
        <div class="order-meta">Ships to: ${order.shipping_address || "N/A"}</div>
      `;
      container.appendChild(card);
    });
  }

  loadOrders();
</script>

</body>
</html>

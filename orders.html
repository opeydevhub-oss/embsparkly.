<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders | E.M.B SPARKLY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --deep-green: #0d2b26;
    --deep-green-dark: #081f1b;
    --gold: #c9a227;
    --gold-light: #e0c05a;
    --cream: #faf6ee;
    --charcoal: #1a1a1a;
    --gray: #6b6b64;
    --success: #2f7a4f;
    --warning: #b5850f;
    --error: #b3413b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--cream);
    color: var(--charcoal);
    line-height: 1.5;
  }

  h1, h2, h3, .brand-name { font-family: 'Cormorant Garamond', serif; }
  a { text-decoration: none; color: inherit; }

  header {
    background: var(--deep-green);
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1200px;
    margin: 0 auto;
  }

  .header-brand { display: flex; align-items: center; gap: 10px; }

  .header-brand img {
    height: 38px;
    width: 38px;
    border-radius: 50%;
    object-fit: cover;
  }

  .brand-name { color: var(--gold-light); font-size: 1.5rem; font-weight: 700; }

  .logout-btn {
    background: transparent;
    border: 1px solid rgba(201,162,39,0.5);
    color: var(--gold-light);
    padding: 7px 14px;
    border-radius: 20px;
    font-family: 'Jost', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
  }

  .page-wrap { max-width: 800px; margin: 0 auto; padding: 24px 16px 60px; }

  .page-title { font-size: 1.6rem; font-weight: 600; color: var(--deep-green); margin-bottom: 20px; }

  .order-card {
    border: 1px solid rgba(13,43,38,0.1);
    border-radius: 8px;
    padding: 16px;
    background: #fff;
    margin-bottom: 14px;
  }

  .order-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }

  .order-id { font-size: 0.78rem; color: var(--gray); }
  .order-date { font-size: 0.75rem; color: var(--gray); margin-top: 2px; }
  .order-total { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 1.2rem; color: var(--deep-green); }

  .status-pill {
    display: inline-block;
    font-size: 0.72rem;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 600;
    text-transform: capitalize;
    margin-top: 4px;
  }

  .status-pending { background: #fdf3d9; color: var(--warning); }
  .status-processing { background: #e4edf7; color: #2a5da0; }
  .status-shipped { background: #e6f0ff; color: #3255a8; }
  .status-delivered { background: #e3f3e8; color: var(--success); }
  .status-cancelled { background: #fdecea; color: var(--error); }

  .order-items-list { font-size: 0.82rem; color: var(--charcoal); margin: 8px 0; }
  .order-items-list div { padding: 2px 0; }

  .order-meta { font-size: 0.78rem; color: var(--gray); margin-top: 8px; }

  .empty-state {
    text-align: center;
    color: var(--gray);
    font-size: 0.9rem;
    padding: 60px 20px;
  }

  .empty-state a {
    display: inline-block;
    margin-top: 14px;
    background: var(--deep-green);
    color: var(--gold-light);
    padding: 10px 22px;
    border-radius: 5px;
    font-weight: 600;
    font-size: 0.85rem;
  }

  footer {
    background: var(--deep-green-dark);
    color: rgba(250,246,238,0.75);
    padding: 32px 20px 20px;
    text-align: center;
    font-size: 0.8rem;
  }
.header-top { position: relative; }
  .header-top .header-brand { position: absolute; left: 50%; transform: translateX(-50%); margin: 0; }
  .header-top .header-icons { margin-left: auto; }

  .site-notice-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    background: var(--gold, #d9b26b);
    color: var(--deep-green, #0e3029);
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 600;
  }

  .site-notice-close {
    background: none;
    border: none;
    color: inherit;
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
    flex: 0 0 auto;
  }

  .menu-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.5rem;
    line-height: 1;
    padding: 0;
    min-width: 40px;
    text-align: left;
    color: var(--gold-light, currentColor);
  }

  .menu-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    opacity: 0;
    visibility: hidden;
    transition: opacity .25s ease, visibility .25s ease;
    z-index: 9999;
  }

  .menu-backdrop.show { opacity: 1; visibility: visible; }

  .menu-drawer {
    position: fixed;
    top: 0;
    left: 0;
    height: 100%;
    width: min(300px, 84vw);
    background: var(--cream, #faf6ee);
    color: var(--deep-green-dark, #081c18);
    transform: translateX(-100%);
    transition: transform .28s ease;
    z-index: 10000;
    overflow-y: auto;
    padding: 20px 18px;
  }

  .menu-drawer.open { transform: translateX(0); }

  .menu-drawer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .menu-drawer-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .menu-drawer-close {
    background: none;
    border: none;
    font-size: 1.7rem;
    line-height: 1;
    cursor: pointer;
    color: inherit;
    padding: 0 4px;
  }

  .menu-links { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }

  .menu-links a {
    padding: 10px 4px;
    font-size: 1rem;
    letter-spacing: 0.02em;
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  }

  .menu-links a:hover { color: var(--gold, #b8860b); }

  .menu-cat-title {
    font-size: 0.75rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gray, #8a8a7e);
    margin: 10px 0 8px;
  }

  .menu-categories { display: flex; flex-direction: column; gap: 2px; }

  .menu-cat-link {
    padding: 9px 4px;
    color: inherit;
    text-decoration: none;
    font-size: 0.95rem;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
  }

  .menu-cat-link:hover { color: var(--gold, #b8860b); }

  .menu-cat-empty { color: var(--gray, #8a8a7e); font-size: 0.85rem; padding: 6px 4px; }
.menu-drawer { display: flex; flex-direction: column; }

  .menu-wa { margin-top: auto; padding-top: 20px; }

  .menu-wa-link {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #25d366;
    color: #fff;
    padding: 11px 14px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
  }

  .menu-wa-link:hover { background: #1ead5a; color: #fff; }

  .menu-wa-link svg { width: 22px; height: 22px; flex-shrink: 0; }
</style>
</head>
<body>

<div id="site-notice"></div>
<div class="menu-backdrop" id="menu-backdrop"></div>
<nav class="menu-drawer" id="menu-drawer" aria-label="Site menu">
  <div class="menu-drawer-head">
    <span class="menu-drawer-title">Menu</span>
    <button type="button" class="menu-drawer-close" id="menu-close" aria-label="Close menu">&times;</button>
  </div>
  <div class="menu-links">
    <a href="index.html">Home</a>
    <a href="catalog.html">Shop</a>
    <a href="new-arrivals.html">New Arrivals</a>
    <a href="orders.html">Track Order</a>
    <a href="index.html#about">About</a>
  </div>
  <div class="menu-cat-title">Categories</div>
  <div class="menu-categories" id="menu-categories"><div class="menu-cat-empty">Loading...</div></div>

  <div class="menu-wa">
    <a class="menu-wa-link" href="https://wa.me/message/NKLSS5LINWZ2H1" target="_blank" rel="noopener">
      <svg viewBox="0 0 448 512" aria-hidden="true"><path fill="currentColor" d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>
      <span>Chat on WhatsApp</span>
    </a>
  </div>
</nav>

<header>
  <div class="header-top">
    <button type="button" class="menu-btn" id="menu-btn" title="Menu" aria-label="Open menu">&#9776;</button>
    <a href="index.html" class="header-brand">
      <img src="image/logo.jpg" alt="E.M.B SPARKLY logo">
      <span class="brand-name">E.M.B SPARKLY</span>
    </a>
    <div class="header-icons">
      <button class="logout-btn" id="logout-btn" style="display:none;">Log Out</button>
    </div>
  </div>
</header>

<div class="page-wrap">
  <div class="page-title">My Orders</div>
  <div id="orders-container">
    <div class="empty-state">Loading your orders...</div>
  </div>
</div>

<footer>
  &copy; 2026 E.M.B SPARKLY. All rights reserved.
</footer>

<script>
  const SUPABASE_URL = "https://vaicofjsxjrbmirrphcc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_UkqihD8tVKi5Y9Ih6n418A_6r5GhMCc";

  /* SITE MENU + NOTIFICATIONS */
  (function() {
    var menuBtn = document.getElementById("menu-btn");
    var drawer = document.getElementById("menu-drawer");
    var backdrop = document.getElementById("menu-backdrop");
    var closeBtn = document.getElementById("menu-close");
    if (!menuBtn || !drawer || !backdrop || !closeBtn) return;

    function openMenu() { drawer.classList.add("open"); backdrop.classList.add("show"); }
    function closeMenu() { drawer.classList.remove("open"); backdrop.classList.remove("show"); }
    menuBtn.addEventListener("click", openMenu);
    closeBtn.addEventListener("click", closeMenu);
    backdrop.addEventListener("click", closeMenu);
    document.addEventListener("keydown", function(e) { if (e.key === "Escape") closeMenu(); });

    if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
      var client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      var catBox = document.getElementById("menu-categories");
      if (catBox) {
        client.from("categories").select("name, slug").order("name").then(function(res) {
          if (res.error || !res.data || res.data.length === 0) {
            catBox.innerHTML = '<div class="menu-cat-empty">Categories coming soon.</div>';
            return;
          }
          catBox.innerHTML = "";
          res.data.forEach(function(c) {
            var a = document.createElement("a");
            a.className = "menu-cat-link";
            a.href = "catalog.html?category=" + encodeURIComponent(c.slug);
            a.textContent = c.name;
            catBox.appendChild(a);
          });
        });
      }

      var notice = document.getElementById("site-notice");
      if (notice) {
        client.from("site_notifications").select("id, message").eq("is_active", true)
          .order("created_at", { ascending: false }).limit(1).then(function(res) {
            if (res.error || !res.data || res.data.length === 0) return;
            var n = res.data[0];
            var key = "emb_notice_closed_" + n.id;
            try { if (localStorage.getItem(key) === "1") return; } catch (e) {}
            var bar = document.createElement("div");
            bar.className = "site-notice-bar";
            var msg = document.createElement("span");
            msg.textContent = n.message;
            var x = document.createElement("button");
            x.type = "button";
            x.className = "site-notice-close";
            x.title = "Dismiss";
            x.innerHTML = "&times;";
            x.addEventListener("click", function() {
              try { localStorage.setItem(key, "1"); } catch (e) {}
              bar.remove();
            });
            bar.appendChild(msg);
            bar.appendChild(x);
            notice.appendChild(bar);
          });
      }
    }
  })();
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function loadOrders() {
    const container = document.getElementById("orders-container");
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
      container.innerHTML = `
        <div class="empty-state">
          Please log in to view your orders.
          <br>
          <a href="login.html?redirect=orders.html">Log In</a>
        </div>
      `;
      return;
    }

    document.getElementById("logout-btn").style.display = "inline-block";

    const { data: orders, error } = await supabaseClient
      .from("orders")
      .select(`
        id, status, total, created_at, shipping_address, phone,
        order_items ( quantity, price, products ( name ) )
      `)
      .eq("user_id", session.user.id)
      .order("created_at", { ascending: false });

    if (error) {
      container.innerHTML = '<div class="empty-state">Could not load your orders right now.</div>';
      return;
    }

    if (!orders || orders.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          You have not placed any orders yet.
          <br>
          <a href="catalog.html">Start Shopping</a>
        </div>
      `;
      return;
    }

    container.innerHTML = "";
    orders.forEach(function(order) {
      const shortId = order.id.slice(0, 8);
      const dateStr = new Date(order.created_at).toLocaleDateString();

      const itemsHtml = (order.order_items || []).map(function(item) {
        const productName = item.products ? item.products.name : "Item";
        return `<div>${item.quantity} x ${productName} - $${Number(item.price).toFixed(2)}</div>`;
      }).join("");

      const card = document.createElement("div");
      card.className = "order-card";
      card.innerHTML = `
        <div class="order-card-top">
          <div>
            <div class="order-id">Order #${shortId}</div>
            <div class="order-date">${dateStr}</div>
            <span class="status-pill status-${order.status}">${order.status}</span>
          </div>
          <div class="order-total">$${Number(order.total).toFixed(2)}</div>
        </div>
        <div class="order-items-list">${itemsHtml || "<div>No items recorded</div>"}</div>
        <div class="order-meta">Ships to: ${order.shipping_address || "N/A"}</div>
      `;
      container.appendChild(card);
    });
  }

  document.getElementById("logout-btn").addEventListener("click", async function() {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
  });

  loadOrders();
</script>

</body>
</html>
